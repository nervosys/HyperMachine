[package]
name = "hm-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "HyperMachine Desktop GUI - virt-manager style interface"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# GUI framework
eframe = { version = "0.31", features = ["persistence", "wgpu"] }
egui = "0.31"
egui_extras = { version = "0.36", features = ["image"] }

# Async runtime
tokio = { workspace = true }

# HTTP client for API communication
reqwest = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Base64 decoding for framebuffer data
base64 = "0.22"

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Image handling for screen display
image = "0.25"

# Cross-platform file dialogs
rfd = "0.15"

# Platform icons
include_dir = "0.7"
chrono.workspace = true

[features]
default = []
vnc = []     # Future: VNC protocol support
spice = []   # Future: SPICE protocol support

[lints]
workspace = true

[[bin]]
name = "hypermachine-gui"
path = "src/main.rs"
