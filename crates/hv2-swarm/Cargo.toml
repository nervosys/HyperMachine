[package]
name = "hv2-swarm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Hierarchical command graph for agent swarms: who may talk to whom, enforced at the only point every message crosses"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Only the examples reach for a hypervisor. The crate itself decides who may
# talk to whom and needs nothing but the standard library to do it -- keeping
# hv2-core out of the dependencies is what lets the policy layer be used
# without one.
[dev-dependencies]
# The wire format the guest speaks, so the examples decode it rather than
# guessing at it.
hv2-agent-proto = { path = "../hv2-agent-proto" }
hv2-core = { path = "../hv2-core", version = "1.1.0" }
# The forward pass the `inference` example puts behind a capability. A
# dev-dependency, not a dependency: the command graph decides who may invoke a
# model and has no business knowing what one is.
hv2-infer = { path = "../hv2-infer" }
# The inference examples build a thread pool of the size a forward pass wants,
# rather than inheriting rayon's global one, which is sized to the whole machine.
rayon = "1.10"
tokio = { workspace = true }
# The vsock example holds a device the VM hands back behind this lock.
parking_lot = { workspace = true }

[[example]]
name = "unikernel_swarm"

[[example]]
name = "guest_transport"

[[example]]
name = "vsock_swarm"

[[example]]
name = "tool_calls"

[[example]]
name = "agent_messages"

[lints]
workspace = true
