[package]
name = "hv2-swarm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Hierarchical command graph for agent swarms: who may talk to whom, enforced at the only point every message crosses"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Only the examples reach for a hypervisor. The crate itself decides who may
# talk to whom and needs nothing but the standard library to do it -- keeping
# hv2-core out of the dependencies is what lets the policy layer be used
# without one.
[dev-dependencies]
hv2-core = { path = "../hv2-core", version = "1.1.0" }
tokio = { workspace = true }

[[example]]
name = "unikernel_swarm"

