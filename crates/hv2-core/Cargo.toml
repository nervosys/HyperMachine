[package]
name = "hv2-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "HyperMachine Type-2 hypervisor core engine"

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
memmap2 = { workspace = true }
bincode = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
bitflags = { workspace = true }
rand = { workspace = true }
ring = { version = "0.17", optional = true }
reqwest = { workspace = true, optional = true }
# Pure-Rust RSA (RustCrypto) — provides RSA key generation and signing, which
# `ring` does not support. Used by the asymmetric crypto module.
rsa = { version = "0.9.10", features = ["sha2"] }
# Post-quantum cryptography (pure-Rust RustCrypto implementations).
# ml-kem: FIPS 203 (ML-KEM), ml-dsa: FIPS 204 (ML-DSA), slh-dsa: FIPS 205 (SLH-DSA).
ml-kem = { version = "0.3.2", features = ["getrandom"], optional = true }
ml-dsa = { version = "0.1.0", optional = true }
slh-dsa = { version = "=0.2.0-rc.5", optional = true }

# CPU affinity (vCPU pinning) — platform-specific syscalls.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
] }

[features]
# `ring` provides the validated AES-GCM/SHA backend; `pqc` provides real
# post-quantum algorithms. Both are on by default so the crypto claims hold
# out of the box. Build with --no-default-features to opt out.
default = ["ring", "pqc"]
fips = []
pqc = ["dep:ml-kem", "dep:ml-dsa", "dep:slh-dsa"]
remote-telemetry = ["dep:reqwest"]

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = "3.10"

[lints]
workspace = true

[[bench]]
name = "crypto_bench"
harness = false

[[bench]]
name = "vm_bench"
harness = false

[[bench]]
name = "vswitch_bench"
harness = false

[[bench]]
name = "cow_bench"
harness = false

[[example]]
name = "serial_console"
path = "examples/serial_console.rs"

[[example]]
name = "timer_demo"
path = "examples/timer_demo.rs"
