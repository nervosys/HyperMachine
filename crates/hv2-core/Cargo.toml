[package]
name = "hv2-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "HyperMachine Type-2 hypervisor core engine"

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
memmap2 = { workspace = true }
# The container module translates OCI specs into confinement this crate does
# not implement; hv2-sandbox is where the syscalls live. It depends on nothing
# from here, so the direction is acyclic.
hv2-sandbox = { path = "../hv2-sandbox", version = "1.1.0" }
bincode = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
bitflags = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, optional = true }
# IronCrypto's RSA: pure Rust, no dependencies outside its own workspace, and
# a private-key path that is constant-time in `d`. Replaces the `rsa` crate,
# whose RUSTSEC-2023-0071 (Marvin) has no fixed release -- this repo carried an
# ignore for it that said "tracked for migration once a constant-time release
# ships". This is that.
#
# From crates.io as of 2026-09-22, having been a pinned git rev while the
# repository was private. That pin existed because the crates were not
# published, not because a rev was wanted, so a version requirement is the
# right shape now -- and it takes `net.git-fetch-with-cli`, a CI token and a
# BuildKit secret out of the build with it.
ic-rsa = "0.1.1"
ic-hash = "0.1.1"
ic-mac = "0.1.1"
ic-kdf = "0.1.1"
ic-cipher = "0.1.1"
ic-ec = "0.1.1"
ic-core = "0.1.1"
# Zeroization of key material on drop. A plain loop or `fill(0)` writes to
# memory that is never read again, which the optimizer is free to delete;
# `zeroize` uses volatile writes so the erasure actually happens.
zeroize = "1.9.0"
# Post-quantum cryptography (pure-Rust RustCrypto implementations).
# ml-kem: FIPS 203 (ML-KEM), ml-dsa: FIPS 204 (ML-DSA), slh-dsa: FIPS 205 (SLH-DSA).
ml-kem = { version = "0.3.2", features = ["getrandom"], optional = true }
ml-dsa = { version = "0.1.0", optional = true }
slh-dsa = { version = "=0.2.0-rc.5", optional = true }

# CPU affinity (vCPU pinning) — platform-specific syscalls.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
] }

[features]
# `pqc` provides real post-quantum algorithms, on by default so the crypto
# claims hold out of the box. Build with --no-default-features to opt out.
#
# There used to be a `ring` feature here too, guarding AES-GCM, SHA-2, HMAC,
# HKDF and ECDSA -- and with it off, every one of those returned
# `NotImplemented`. IronCrypto needs no feature: it is pure Rust with no build
# script, so those primitives are now unconditional and image admission
# control, which needs a SHA-256 to identify a boot image, can no longer be
# compiled out from under itself.
default = ["pqc"]
fips = []
pqc = ["dep:ml-kem", "dep:ml-dsa", "dep:slh-dsa"]
remote-telemetry = ["dep:reqwest"]

[dev-dependencies]
# The wire format the guest speaks, so the examples decode it rather than
# guessing at it.
hv2-agent-proto = { path = "../hv2-agent-proto" }
proptest = { workspace = true }
criterion = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = "3.10"
# `test-util` provides tokio::time::pause/advance, so timer tests assert on
# virtual time instead of racing the wall clock on a loaded machine.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[[bench]]
name = "crypto_bench"
harness = false

[[bench]]
name = "vm_bench"
harness = false

[[bench]]
name = "vswitch_bench"
harness = false

[[bench]]
name = "cow_bench"
harness = false

[[example]]
name = "serial_console"
path = "examples/serial_console.rs"

[[example]]
name = "timer_demo"
path = "examples/timer_demo.rs"
