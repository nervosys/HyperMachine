[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = "3.27"

[lints]
workspace = true

[[bench]]
name = "crypto_bench"
harness = false

[[bench]]
name = "vm_bench"
harness = false

[[bench]]
name = "vswitch_bench"
harness = false

[[example]]
