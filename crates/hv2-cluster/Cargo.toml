[package]
name = "hv2-cluster"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "HyperMachine multi-node sandbox cluster: shared store, scheduler, stateless control plane"

[dependencies]
# The envd proxy the control plane runs, with cluster-aware routes.
hv2-api = { path = "../hv2-api", version = "1.1.0" }

tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
subtle = { version = "2.6", default-features = false }
form_urlencoded = "1"

# CubeMaster coordinates through Redis; so does this, and Valkey speaks the
# same protocol. No TLS feature: a store reached over an untrusted network is
# a deployment to front with stunnel or a private network, not one to build in.
redis = { version = "1.7", default-features = false, features = [
    "tokio-comp",
    "connection-manager",
    "streams",
] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { workspace = true }

[[bin]]
name = "hv2-control-plane"
path = "src/bin/hv2-control-plane.rs"

[lints]
workspace = true
