[package]
name = "hv2-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "HyperMachine AI agent interface with MCP server"

[dependencies]
hv2-core = { path = "../hv2-core", version = "1.1.0" }

tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

# Scripting engines
rhai = { workspace = true }
# wasmtime is reserved for a future WASM scripting backend; opt-in via `wasm-scripts` feature.
# Not pulled into default builds — eliminates wasmtime CVE exposure (RUSTSEC-2026-0085..96).
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }

[features]
default = []
# Reserved: enables wasmtime-based scripting engine. No source currently uses it.
wasm-scripts = ["dep:wasmtime", "dep:wasmtime-wasi"]

# Security (Linux only - commented out for Windows compatibility)
# seccompiler = "0.4"

[dev-dependencies]
proptest = { workspace = true }
tracing-subscriber = { workspace = true }
criterion = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "mcp_bench"
harness = false

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "agent_script"
path = "examples/agent_script.rs"

[[example]]
name = "advanced"
path = "examples/advanced.rs"

[[example]]
name = "integrated"
path = "examples/integrated.rs"

[[example]]
name = "agent_mcp_workflow"
path = "examples/agent_mcp_workflow.rs"

[[example]]
name = "llm_tool_schemas"
path = "examples/llm_tool_schemas.rs"

[[example]]
name = "multi_agent_orchestration"
path = "examples/multi_agent_orchestration.rs"

[[example]]
name = "agent_runtime"
path = "examples/agent_runtime.rs"
