# These are spelled out rather than inherited with `.workspace = true`.
#
# This package is in the root manifest's `exclude` list, and cargo will not let
# a non-member inherit `workspace.package.*` -- so every cargo invocation
# against this manifest, including the one in ci.yml, failed at parse time with
# "error inheriting `rust-version` ... failed to find a workspace root". The CI
# step carries `continue-on-error: true` and a comment attributing the failure
# to nightly drift, so it has been reported as a known-flaky toolchain problem
# rather than as a manifest that cannot be read at all.
#
# `hv2-unikernel`, excluded for the same reason, already spells its values out.
[package]
name = "hv1-boot"
version = "1.1.0"
edition = "2024"  # stable since Rust 1.85; the nightly requirement here is
                  # the `bootloader` build script, which passes -Z flags
rust-version = "1.95"
publish = false
authors = ["HyperMachine Contributors"]
license = "AGPL-3.0-only OR LicenseRef-Commercial"
repository = "https://github.com/nervosys/HyperMachine"
homepage = "https://github.com/nervosys/HyperMachine"
keywords = ["hypervisor", "virtualization", "kvm", "ai-agent", "vm"]
categories = ["virtualization", "os", "hardware-support"]
description = "HyperMachine Type-1 Hypervisor Bootable Image"

[[bin]]
name = "hv1"
path = "src/main.rs"

[dependencies]
hv1-core = { path = "../hv1-core", features = ["intel", "amd", "serial"] }
bootloader_api = "0.11"
# default-features = false drops the crate's "nightly" feature, which gates
# abi_x86_interrupt and so cannot build on the stable toolchain this repo
# pins. "instructions" is the half we actually use: CPU intrinsics and MSR
# access. Reported as issue #57 -- a clean clone could not run
# `cargo check --workspace` at all, and CI hid it by excluding this crate.
x86_64 = { version = "0.15", default-features = false, features = ["instructions"] }
linked_list_allocator = "0.10"
log = "0.4"

[build-dependencies]
bootloader = "0.11"

[features]
default = ["intel", "amd"]
intel = []
amd = []

# Copied from the workspace rather than inherited, for the reason at the
# top of this file: an excluded package cannot say `workspace = true`.
[lints.rust]
# Note: unsafe_code intentionally not warned — unsafe is inherent to hypervisor code.
# unreachable_pub and unused_qualifications omitted — too noisy for internal crate items.
unused_import_braces = "warn"

[lints.clippy]
# Correctness
manual_clamp = "warn"
manual_range_contains = "warn"
needless_range_loop = "warn"
useless_format = "warn"
# Style
single_match = "warn"
let_and_return = "warn"
map_entry = "warn"
collapsible_if = "warn"
doc_markdown = "allow"
semicolon_if_nothing_returned = "warn"
inefficient_to_string = "warn"
# Complexity thresholds (allow via #[allow] where justified)
type_complexity = "warn"
too_many_arguments = "warn"