# Not a workspace member. It targets 32-bit bare metal, so it cannot be built
# for the host and `cargo build --workspace` would fail on a clean clone --
# the same reason `hv1-boot` is excluded. `hv2-core`'s `rust_unikernel`
# example builds it by name, and so does CI.
[package]
name = "hv2-unikernel"
version = "1.1.0"
edition = "2021"
authors = ["HyperMachine Contributors"]
license = "AGPL-3.0-only OR LicenseRef-Commercial"
repository = "https://github.com/nervosys/HyperMachine"
description = "A Multiboot unikernel in no_std Rust: the whole guest, in one binary"
publish = false

[[bin]]
name = "hv2-unikernel"
path = "src/main.rs"

# No unwinder exists in a guest with no kernel under it, so a panic that tried
# to unwind would fail to link rather than fail at runtime.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# Speed, not size. `opt-level = "s"` was right for a guest whose whole job was
# to write to a serial port, and it forbids vectorisation — which measured as
# 191 MiB/s through the one loop an inference workload is made of. An image a
# few kilobytes larger is not a cost this project has ever had to care about;
# the rate a guest can stream weights at is the ceiling on how fast an agent
# can think.
opt-level = 3
lto = true
codegen-units = 1
