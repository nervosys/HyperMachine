[package]
name = "hm-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "HyperMachine CLI - Unified hypervisor management for Type 1 and Type 2 modes"

[lib]
name = "hm_cli"
path = "src/lib.rs"

[[bin]]
name = "hm"
path = "src/main.rs"

[dependencies]
hv2-core = { path = "../hv2-core" }
hv2-agent = { path = "../hv2-agent" }
# hv2-api = { path = "../hv2-api" }  # Requires protoc - enable when needed

tokio = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls",
], default-features = false }

# MCP HTTP server
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

# Shell completions
clap_complete = "4.5"

[dev-dependencies]
tempfile = "3.10"
