[package]
name = "hv1-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "HyperMachine Type-1 bare-metal hypervisor core"
keywords.workspace = true
categories.workspace = true

[features]
default = ["intel", "amd"]
intel = []                 # Intel VT-x (VMX) support
amd = []                   # AMD-V (SVM) support
serial = []                # Serial console support
acpi = []                  # ACPI support

[dependencies]
# No-std compatible crates
spin = "0.9"
bitflags = "2.4"
log = "0.4"
static_assertions = "1.1"

# x86_64 specific
x86_64 = "0.15"
x86 = "0.52"
raw-cpuid = "11.0"

# Memory management
linked_list_allocator = "0.10"

# Bootloader integration (for standalone builds)
bootloader_api = { version = "0.11", optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
# Additional x86_64 dependencies

[dev-dependencies]

[lib]
# Can be built as no_std for bare-metal
# crate-type = ["staticlib", "rlib"]

[[bin]]
name = "hv1-kernel"
path = "src/main.rs"
required-features = ["bootloader_api"]
