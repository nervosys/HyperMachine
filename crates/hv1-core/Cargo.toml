[package]
name = "hv1-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false
description = "HyperMachine Type-1 bare-metal hypervisor core"
keywords.workspace = true
categories.workspace = true

[features]
default = ["intel", "amd"]
intel = []                 # Intel VT-x (VMX) support
amd = []                   # AMD-V (SVM) support
arm64 = ["dep:hv1-arm"]    # ARM64 EL2 support
serial = []                # Serial console support
acpi = []                  # ACPI support

[dependencies]
# No-std compatible crates
spin = "0.12"
bitflags = "2.4"
log = "0.4"
static_assertions = "1.1"

# Memory management
linked_list_allocator = "0.10"

# Bootloader integration (for standalone builds)
bootloader_api = { version = "0.11", optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
# x86-only crates (CPU structures/intrinsics, MSR access, CPUID). hv1-core is
# the x86_64 Intel-VMX / AMD-SVM Type-1 hypervisor; ARM is the separate
# hv1-arm crate, so these must not be pulled into non-x86 builds.
x86_64 = "0.15"
x86 = "0.52"
raw-cpuid = "11.0"

[target.'cfg(target_arch = "aarch64")'.dependencies]
hv1-arm = { path = "../hv1-arm", optional = true }

[dev-dependencies]

[lib]
# Can be built as no_std for bare-metal
# crate-type = ["staticlib", "rlib"]

[lints]
workspace = true

[[bin]]
name = "hv1-kernel"
path = "src/main.rs"
required-features = ["bootloader_api"]
