[package]
name = "hv2-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "HyperMachine REST and gRPC API server"

[dependencies]
hv2-core = { path = "../hv2-core", version = "1.1.0" }
hv2-agent = { path = "../hv2-agent", version = "1.1.0" }
hv2-runtime = { path = "../hv2-runtime", version = "1.1.0" }
hv2-context = { path = "../hv2-context", version = "1.1.0" }
hv2-sandbox = { path = "../hv2-sandbox", version = "1.1.0" }

tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

# gRPC
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
# For filesystem.proto's `google.protobuf.Timestamp` (envd_filesystem.rs).
# Not in [workspace.dependencies]; versioned in lockstep with prost itself.
prost-types = "0.14"

# REST API
axum = { workspace = true }
tower = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
# Body types for the sandbox proxy: the backend's stream is passed through,
# and its own short error replies need a body that is not `Incoming`.
http-body-util = "0.1"
bytes = "1"
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
toml = { workspace = true }
flate2 = { workspace = true }

# TLS
rustls = { workspace = true }
tokio-rustls = { workspace = true }
# rustls-pemfile is unmaintained (RUSTSEC-2025-0134); use rustls-pki-types' built-in PEM parser instead.
rustls-pki-types = { version = "1.10", features = ["std", "alloc"] }

# Constant-time byte equality for secret comparison (API keys, tokens).
subtle = { version = "2.6", default-features = false }

# IronCrypto: the HMAC-SHA256 behind request-signature verification. Replaces a
# hand-written RFC 2104 over a hand-written SHA-256 that lived in middleware.rs.
ic-core = "0.1.1"
ic-hash = "0.1.1"
ic-mac = "0.1.1"

# Protobuf-JSON (the "JSON mapping" in protobuf's own spec) for the generated
# types. Needed because E2B's SDK speaks the Connect protocol with a JSON
# codec, and protobuf-JSON is not what `#[derive(Serialize)]` produces: field
# names are lowerCamelCase, 64-bit integers are strings, enums are their names,
# and Timestamp is an RFC 3339 string. See src/connect.rs.
pbjson = "0.9"
# `google.protobuf.Timestamp` with that same JSON mapping (RFC 3339), which
# prost-types' own Timestamp does not carry. filesystem.proto imports it, so
# the generated code uses this one instead -- see build.rs.
pbjson-types = "0.9"

[build-dependencies]
tonic-prost-build = { workspace = true }
pbjson-build = "0.9"

[dev-dependencies]
criterion = { workspace = true }
tempfile = "3.10"

# Used by examples/e2b_compat.rs, which sets up its own subscriber. Without it
# `cargo test --workspace` fails to build for the whole repository, because
# `cargo test` compiles examples.
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "api_bench"
harness = false
