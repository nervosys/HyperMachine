# HV2 Configuration Example

[server]
# REST/MCP API port
port = 8080
# gRPC port (requires protoc)
# grpc_port = 50051
# API key for authentication (optional)
# api_key = "your-secret-key"
# Rate limit: requests per minute per IP
rate_limit = 100

[logging]
# Log level: trace, debug, info, warn, error
level = "info"
# Log format: json, pretty
format = "json"

[security]
# FIPS 140-3 mode: enabled, disabled
fips_mode = "disabled"
# TLS for API endpoints
tls_enabled = false
# tls_cert = "/path/to/cert.pem"
# tls_key = "/path/to/key.pem"

[vm]
name = "production-vm"
vcpus = 8
memory_mb = 16384

[network]
enabled = true
interface = "tap0"
ip_address = "192.168.100.10"

[gpu]
enabled = true
device = "default"
passthrough = false

[agent]
enabled = true
script_timeout_seconds = 300
max_memory_mb = 512

# No [observability] section: nothing in this repository loads this file into
# hv2-core's Config, and no shipped binary turns on its `remote-telemetry`
# exporter, so those settings were read by nothing. A node and the control
# plane export OTLP metrics from OTEL_EXPORTER_OTLP_ENDPOINT,
# OTEL_EXPORTER_OTLP_HEADERS, OTEL_METRIC_EXPORT_INTERVAL and
# OTEL_SERVICE_NAME, or --otlp-endpoint, --otlp-header and --otlp-interval:
# see docs/TELEMETRY.md.
