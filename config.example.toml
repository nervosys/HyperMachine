# HV2 Configuration Example

[server]
# REST/MCP API port
port = 8080
# gRPC port (requires protoc)
# grpc_port = 50051
# API key for authentication (optional)
# api_key = "your-secret-key"
# Rate limit: requests per minute per IP
rate_limit = 100

[logging]
# Log level: trace, debug, info, warn, error
level = "info"
# Log format: json, pretty
format = "json"

[security]
# FIPS 140-3 mode: enabled, disabled
fips_mode = "disabled"
# TLS for API endpoints
tls_enabled = false
# tls_cert = "/path/to/cert.pem"
# tls_key = "/path/to/key.pem"

[vm]
name = "production-vm"
vcpus = 8
memory_mb = 16384

[network]
enabled = true
interface = "tap0"
ip_address = "192.168.100.10"

[gpu]
enabled = true
device = "default"
passthrough = false

[agent]
enabled = true
script_timeout_seconds = 300
max_memory_mb = 512

[observability]
tracing = true
metrics = true
otlp_endpoint = "http://localhost:4317"

[observability.remote]
# Enable remote OTLP export (requires `remote-telemetry` feature)
enabled = false
# OTLP endpoint — set via config or OTEL_EXPORTER_OTLP_ENDPOINT env var
endpoint = "https://nervosys.ai/otlp"
# Service name — set via config or OTEL_SERVICE_NAME env var
service_name = "hypermachine"
# Request timeout in seconds
timeout_seconds = 10
# Background flush interval in seconds
flush_interval_seconds = 15
# Max retry attempts for transient failures
max_retries = 3
# Max buffered metric batches before oldest are dropped
max_queue_size = 4096
# Headers — prefer OTEL_EXPORTER_OTLP_HEADERS env var for secrets
# headers = "Authorization=Bearer <token>"
