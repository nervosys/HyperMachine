# HV2 Configuration Example

[server]
# REST/MCP API port
port = 8080
# gRPC port (requires protoc)
# grpc_port = 50051
# API key for authentication (optional)
# api_key = "your-secret-key"
# Rate limit: requests per minute per IP
rate_limit = 100

[vm]
name = "production-vm"
vcpus = 8
memory_mb = 16384

[network]
enabled = true
interface = "tap0"
ip_address = "192.168.100.10"

[gpu]
enabled = true
device = "default"
passthrough = false

[agent]
enabled = true
script_timeout_seconds = 300
max_memory_mb = 512

[observability]
tracing = true
metrics = true
otlp_endpoint = "http://localhost:4317"
