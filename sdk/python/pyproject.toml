[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hypermachine"
version = "0.1.0"
description = "A client for HyperMachine's machine API, with no dependencies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only OR LicenseRef-Commercial" }

[tool.setuptools]
packages = ["hypermachine"]
