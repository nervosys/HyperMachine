[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hypermachine"
version = "0.1.0"
description = "A client for HyperMachine's machine API, with no dependencies"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only OR LicenseRef-Commercial"
license-files = ["LICENSE", "LICENSE-COMMERCIAL"]
authors = [{ name = "NERVOSYS, LLC" }]
keywords = ["hypermachine", "sandbox", "microvm", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/nervosys/HyperMachine"
Source = "https://github.com/nervosys/HyperMachine/tree/master/sdk/python"
Issues = "https://github.com/nervosys/HyperMachine/issues"

[tool.setuptools]
packages = ["hypermachine"]
