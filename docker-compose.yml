# Docker Compose for HyperMachine
#
# Usage:
#   docker compose up -d
#
# With custom API key:
#   HM_API_KEY=your-secret docker compose up -d

services:
  hypermachine:
    build: .
    image: hypermachine:latest
    container_name: hypermachine-mcp
    ports:
      - "8080:8080"
    environment:
      - HM_API_KEY=${HM_API_KEY:-}
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - hypermachine-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  hypermachine-data:
    driver: local
