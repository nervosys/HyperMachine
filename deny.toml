# deny.toml - Cargo Deny Configuration
# https://embarkstudios.github.io/cargo-deny/

# ============================================================================
# Advisories Configuration
# ============================================================================
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]

# Ignore specific advisories (with justification)
ignore = [
    # bincode 1.x is unmaintained but used by bootloader crate
    # We only use it in build-time dependencies
    "RUSTSEC-2025-0141",

    # fxhash is unmaintained but has no known vulnerabilities
    # Used for fast, non-cryptographic hashing only (transitive dep)
    "RUSTSEC-2025-0057",

    # paste is archived but has no known vulnerabilities
    # Used as transitive dep by wasmtime/cranelift
    "RUSTSEC-2024-0436",
]

# ============================================================================
# Licenses Configuration
# ============================================================================
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "AGPL-3.0-only",
    "LicenseRef-Commercial",
    "GPL-3.0-only",
    "LGPL-3.0-only",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "NCSA",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# Exceptions for specific crates
[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# ============================================================================
# Bans Configuration
# ============================================================================
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Deny specific crates known for security issues
deny = [
    # Unmaintained crypto crates
    { name = "rustc-serialize" },
]

# Allow specific duplicates that are acceptable
skip = [
    # Multiple versions are acceptable for these
    { name = "hashbrown" },
    { name = "syn" },
    { name = "thiserror" },
    { name = "thiserror-impl" },
]

# ============================================================================
# Sources Configuration
# ============================================================================
[sources]
unknown-registry = "deny"
unknown-git = "warn"

allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "https://index.crates.io/",
]

allow-git = []
