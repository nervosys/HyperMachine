# deny.toml - Cargo Deny Configuration
# https://embarkstudios.github.io/cargo-deny/

# ============================================================================
# Advisories Configuration
# ============================================================================
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]

# Ignore specific advisories (with justification)
ignore = [
    # bincode 1.x is unmaintained but used by bootloader crate
    # We only use it in build-time dependencies
    "RUSTSEC-2025-0141",

    # paste is archived but has no known vulnerabilities
    # Used as transitive dep by wasmtime/cranelift
    "RUSTSEC-2024-0436",

    # Marvin Attack: timing sidechannel in the pure-Rust `rsa` crate.
    # `rsa` is the only pure-Rust RSA implementation that supports key
    # generation (ring/aws-lc-rs do not), so it backs the asymmetric crypto
    # module's RSA keygen/sign. There is no fixed release upstream. The attack
    # requires an adversary able to make precise timing measurements of RSA
    # private-key operations on chosen inputs; HyperMachine does not expose RSA
    # as an online decryption oracle. Tracked for migration once a constant-time
    # release ships.
    "RUSTSEC-2023-0071",

    # quick-xml 0.30.0: quadratic parse time on duplicate attributes, and
    # unbounded namespace-declaration allocation. Fixed in >=0.41.0, and 0.41
    # is already in the tree -- the vulnerable 0.30 arrives through the Linux
    # GUI accessibility stack:
    #   egui-winit -> accesskit_winit -> accesskit_unix
    #     -> accesskit_atspi_common -> atspi-common -> zbus-lockstep
    #     -> zbus_xml -> quick-xml 0.30
    # No version of that chain currently resolves to a fixed quick-xml, so
    # there is nothing to bump here. Only reachable when hm-gui runs on Linux
    # with an AT-SPI screen reader attached, parsing D-Bus introspection XML
    # from the local session bus.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # smartstring is unmaintained. Transitive via rhai, which is the agent
    # scripting engine. No known vulnerability; rhai has not migrated off it.
    "RUSTSEC-2026-0249",

    # ttf-parser is unmaintained. Transitive via egui -> epaint -> ab_glyph
    # -> owned_ttf_parser. Font parsing for the desktop GUI only; no known
    # vulnerability.
    "RUSTSEC-2026-0192",
]

# ============================================================================
# Licenses Configuration
# ============================================================================
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "AGPL-3.0-only",
    "LicenseRef-Commercial",
    "GPL-3.0-only",
    "LGPL-3.0-only",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "NCSA",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# Exceptions for specific crates
[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# ============================================================================
# Bans Configuration
# ============================================================================
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Deny specific crates known for security issues
deny = [
    # Unmaintained crypto crates
    { name = "rustc-serialize" },
]

# Allow specific duplicates that are acceptable
skip = [
    # Multiple versions are acceptable for these
    { name = "hashbrown" },
    { name = "syn" },
    { name = "thiserror" },
    { name = "thiserror-impl" },
]

# ============================================================================
# Sources Configuration
# ============================================================================
[sources]
unknown-registry = "deny"
unknown-git = "warn"

allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "https://index.crates.io/",
]

allow-git = []
