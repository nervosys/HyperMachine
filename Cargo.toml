[workspace]
members = [
    "crates/hv1-core",
    "crates/hv2-core",
    "crates/hv2-cpu",
    "crates/hv2-gpu",
    "crates/hv2-net",
    "crates/hv2-agent",
    "crates/hv2-api",
    "crates/hv2-cli",
    "crates/hm-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["HyperMachine Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nervosys/HyperMachine"
rust-version = "1.75"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Networking
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
hyper = "1.4"
axum = "0.7"
tower = "0.4"

# GPU acceleration
wgpu = "22.0"
vulkan-rs = "0.2"
ash = "0.38"

# Memory management
memmap2 = "0.9"
parking_lot = "0.12"
crossbeam = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.25"
opentelemetry = "0.24"
opentelemetry-otlp = "0.17"

# Configuration
config = "0.14"
toml = "0.8"

# Time and date
chrono = "0.4"

# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"

# Testing
proptest = "1.5"
criterion = "0.5"

# Security (Linux only - commented out for Windows compatibility)
# seccompiler = "0.4"
# caps = "0.5"

# Scripting for AI agents
rhai = { version = "1.19", features = ["sync"] }
wasmtime = "24.0"
wasmtime-wasi = "24.0"

# Metrics
prometheus = "0.13"
metrics = "0.23"

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
inherits = "release"
