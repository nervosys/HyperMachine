[workspace]
members = [
    "crates/hv1-core",
    "crates/hv1-boot",
    "crates/hv2-core",
    "crates/hv2-cpu",
    "crates/hv2-gpu",
    "crates/hv2-net",
    "crates/hv2-agent",
    "crates/hv2-api",
    "crates/hv2-cli",
    "crates/hm-cli",
    "crates/hm-gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["HyperMachine Contributors"]
license = "AGPL-3.0-only OR LicenseRef-Commercial"
repository = "https://github.com/nervosys/HyperMachine"
homepage = "https://github.com/nervosys/HyperMachine"
rust-version = "1.87"
description = "High-performance hypervisor framework with first-class AI agent support"
keywords = ["hypervisor", "virtualization", "kvm", "ai-agent", "vm"]
categories = ["virtualization", "os", "hardware-support"]

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Networking
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
hyper = "1.4"
axum = "0.7"
tower = "0.4"

# GPU acceleration
wgpu = "22.0"
ash = "0.38"

# Memory management
memmap2 = "0.9"
parking_lot = "0.12"
crossbeam = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "2"

# HTTP client
reqwest = { version = "0.12", default-features = true, features = ["json"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
toml = "0.8"

# Time and date
chrono = "0.4"

# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"

# Testing
proptest = "1.5"
criterion = "0.5"

# Security (Linux only - commented out for Windows compatibility)
# seccompiler = "0.4"
# caps = "0.5"

# Scripting for AI agents
rhai = { version = "1.19", features = ["sync"] }
wasmtime = "24.0.5"
wasmtime-wasi = "24.0.5"

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
bitflags = "2.4"
rand = "0.8"

[workspace.lints.rust]
# Note: unsafe_code intentionally not warned — unsafe is inherent to hypervisor code.
# unreachable_pub and unused_qualifications omitted — too noisy for internal crate items.
unused_import_braces = "warn"

[workspace.lints.clippy]
# Correctness
manual_clamp = "warn"
manual_range_contains = "warn"
needless_range_loop = "warn"
useless_format = "warn"
# Style
single_match = "warn"
let_and_return = "warn"
map_entry = "warn"
collapsible_if = "warn"
doc_markdown = "allow"
semicolon_if_nothing_returned = "warn"
inefficient_to_string = "warn"
# Complexity thresholds (allow via #[allow] where justified)
type_complexity = "warn"
too_many_arguments = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
overflow-checks = true

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
inherits = "release"

[profile.test]
opt-level = 1
