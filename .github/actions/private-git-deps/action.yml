name: Private git dependencies
description: >
    Give cargo access to github.com/nervosys/IronCrypto, which hv2-core and
    hv2-api depend on by git URL and which is private.

inputs:
    token:
        description: >
            A token that can read github.com/nervosys/IronCrypto. The
            repository's own GITHUB_TOKEN cannot: it is scoped to the
            repository the workflow runs in, so a second private repository
            needs a PAT or a GitHub App token supplied as a secret.
        required: false
        default: ""

runs:
    using: composite
    steps:
        # `.cargo/config.toml` sets `net.git-fetch-with-cli`, because cargo's
        # bundled libgit2 has no way to reach a credential helper. That makes
        # this the whole configuration: the git CLI rewrites the URL and
        # carries the token, and cargo inherits it.
        - name: Authenticate to IronCrypto
          shell: bash
          run: |
              if [ -z "${{ inputs.token }}" ]; then
                  # Deliberately not a failure. A fork, or a Dependabot run,
                  # has no access to the secret, and the honest place for that
                  # to surface is the fetch itself -- which says which
                  # repository it could not reach -- rather than here, where
                  # the message would only be about a missing secret.
                  echo "::warning::No IRONCRYPTO_TOKEN; the IronCrypto fetch will fail if this job builds hv2-core or hv2-api."
                  exit 0
              fi
              git config --global \
                  url."https://x-access-token:${{ inputs.token }}@github.com/nervosys/IronCrypto".insteadOf \
                  "https://github.com/nervosys/IronCrypto"
