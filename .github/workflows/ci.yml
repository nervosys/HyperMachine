name: CI

on:
    push:
        branches: [master, main]
    pull_request:
        branches: [master, main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: -D warnings

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Install protoc
              uses: arduino/setup-protoc@v3
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Run cargo check
              run: cargo check --workspace --all-targets

    test:
        name: Test
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Install protoc
              uses: arduino/setup-protoc@v3
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            # hv1-core is the x86_64 Type-1 hypervisor and says so itself: its
            # lib.rs carries a compile_error! refusing any other architecture,
            # pointing at hv1-arm instead. macos-latest is ARM64, so it has to
            # be excluded there -- and only there. On the x86_64 runners it is
            # built and tested like every other crate, which is the point of
            # having removed the blanket exclusions in #70.
            - name: Run tests
              run: cargo test --workspace --exclude hv2-core ${{ runner.arch == 'ARM64' && '--exclude hv1-core' || '' }}

    test-core:
        name: Test Core (Linux only)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-core-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-core-
                      ${{ runner.os }}-cargo-

            - name: Install protoc
              uses: arduino/setup-protoc@v3
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Run core tests
              run: cargo test -p hv2-core

            - name: Run doc tests
              run: cargo test --doc --workspace

    test-core-windows:
        name: Test Core (Windows)
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-core-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-core-
                      ${{ runner.os }}-cargo-

            - name: Run core tests (Windows/WHPX)
              run: cargo test -p hv2-core

    test-core-macos:
        name: Test Core (macOS)
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-core-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-core-
                      ${{ runner.os }}-cargo-

            - name: Run core tests (macOS/HVF)
              run: cargo test -p hv2-core

    msrv:
        name: MSRV Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Read from Cargo.toml rather than pinned here. A hard-coded
            # number drifts: this job pinned 1.87 while the workspace declared
            # 1.95, so `cargo check` failed in the resolver -- egui 0.36
            # requires 1.95 -- and had nothing to do with this repository's own
            # code. Taking it from the manifest makes the two impossible to
            # disagree.
            # `sed`, not `cut -d'\"'`, which is what this was and which never
            # worked: a delimiter has to be one character and `\"` is two, so
            # GNU cut refused it, the substitution produced nothing, and the
            # step "succeeded" with an empty version. The job then installed
            # whatever toolchain the action defaults to, so from the day this
            # replaced a hardcoded 1.87 it checked something other than the
            # MSRV while reporting success. It only became visible when the
            # unpinned action started rejecting an empty toolchain outright.
            #
            # Fails loudly now if the manifest ever stops declaring one.
            - name: Read the MSRV from Cargo.toml
              id: msrv
              run: |
                  set -euo pipefail
                  version=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
                  if [ -z "$version" ]; then
                      echo "no rust-version in Cargo.toml; nothing to check an MSRV against" >&2
                      exit 1
                  fi
                  echo "resolved MSRV: $version"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Install MSRV toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ steps.msrv.outputs.version }}

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-msrv-
                      ${{ runner.os }}-cargo-

            - name: Install protoc
              uses: arduino/setup-protoc@v3
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Check MSRV compatibility
              run: cargo check --workspace --all-targets

    fmt:
        name: Rustfmt
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt

            - name: Check formatting
              run: cargo fmt --all -- --check

    clippy:
        name: Clippy
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-clippy-
                      ${{ runner.os }}-cargo-

            - name: Install protoc
              uses: arduino/setup-protoc@v3
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Run clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

    doc:
        name: Documentation
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Install protoc
              uses: arduino/setup-protoc@v3
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Build documentation
              run: cargo doc --workspace --no-deps
              env:
                  RUSTDOCFLAGS: -D warnings

    example-queueing:
        name: Example (queueing)
        runs-on: ubuntu-latest
        # The first example CI has ever run.
        #
        # All sixteen of them are where this project's measured claims come
        # from, and none of them were automated: fourteen need /dev/kvm or a
        # model that can actually answer, and a hosted runner has neither. This
        # one is the exception, and the reason is worth stating -- `queueing`
        # never reads a token of output. It asserts that everyone was served,
        # that the queue really filled, and that urgent agents waited less than
        # routine ones, which are properties of the scheduler and not of the
        # weights. So a structurally valid llama GGUF is enough, and
        # `tools/mk-test-gguf.py` writes one in 359 KiB.
        #
        # It is not a benchmark. The wait figures here are step counts, which
        # are scale-free -- the staircase still comes out at askers/lanes - 1
        # -- but the seconds are meaningless and nothing asserts on them.
        # `bandwidth` was tried against the same fixture and deliberately left
        # out: 359 KiB fits in cache, so it reports 11 GiB/s and measures the
        # probe rather than the memory bus.
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-example-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-example-
                      ${{ runner.os }}-cargo-

            - name: Build the test model
              run: python3 tools/mk-test-gguf.py "${RUNNER_TEMP}/tiny-llama.gguf"

            - name: Run the queueing example
              run: |
                  cargo run --release -p hv2-infer --example queueing --                       "${RUNNER_TEMP}/tiny-llama.gguf"

    build-cli:
        name: Build CLI
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      artifact: hm
                      extra_artifact: hv2
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      artifact: hm.exe
                      extra_artifact: hv2.exe
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      artifact: hm
                      extra_artifact: hv2
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-build-
                      ${{ runner.os }}-cargo-

            - name: Install protoc
              uses: arduino/setup-protoc@v3
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Build CLIs
              run: |
                  cargo build --release --package hm-cli
                  cargo build --release --package hv2-cli

            - name: Upload hm artifact
              uses: actions/upload-artifact@v4
              with:
                  name: hm-${{ matrix.target }}
                  path: target/release/${{ matrix.artifact }}
                  retention-days: 30

            - name: Upload hv2 artifact
              uses: actions/upload-artifact@v4
              with:
                  name: hv2-${{ matrix.target }}
                  path: target/release/${{ matrix.extra_artifact }}
                  retention-days: 30

    # ── HV1 (Type 1 bare-metal hypervisor) — requires nightly ──

    # The HV1 jobs pin an exact nightly rather than tracking the latest.
    # Unpinned, they broke four times in one day for reasons unrelated to
    # any commit here: a new required method on core::iter::Step (x86_64),
    # a renamed rustc-abi value (bootloader), an unused_must_use lint under
    # -D warnings, and a yanked spin release. 2026-08-17 is the nightly that
    # produced the first all-green run (CI 32192729164).
    #
    # Bump this date deliberately and watch these jobs when you do; that is
    # the tradeoff for them no longer failing at random.
    #
    # The steps below name the toolchain explicitly: `cargo +nightly-2026-08-17`.
    # rust-toolchain.toml pins channel = "stable" for the repo, and that file
    # overrides whatever default the action sets -- a bare `cargo` here runs
    # stable and dies on "-Z is only accepted on the nightly channel". Keep
    # the date in the `with:` blocks and in these commands in step.
    hv1-check:
        name: HV1 Check (nightly, bare-metal)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install nightly toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: nightly-2026-08-17
                  components: rust-src

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-hv1-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-hv1-
                      ${{ runner.os }}-cargo-

            - name: Check hv1-core (x86_64-unknown-none)
              run: >
                  cargo +nightly-2026-08-17 check -p hv1-core
                  --target x86_64-unknown-none
                  -Zbuild-std=core,alloc
                  -Zbuild-std-features=compiler-builtins-mem

            # bootloader 0.11.17's build script shells out to `cargo install`
            # for its BIOS/UEFI stages, and that nested build fails to compile
            # lock_api 0.4.10 ("can't find crate for `std`"). Reproduced locally
            # on a different nightly, with and without -Zbuild-std, and for the
            # host target as well -- so it is not our configuration and not
            # nightly drift. Non-blocking until upstream ships a fix; the step
            # still runs and its result is still visible.
            - name: Check hv1-boot (x86_64-unknown-none)
              continue-on-error: true
              run: >
                  cargo +nightly-2026-08-17 check --manifest-path crates/hv1-boot/Cargo.toml
                  --target x86_64-unknown-none
                  -Zbuild-std=core,alloc
                  -Zbuild-std-features=compiler-builtins-mem

    hv1-arm-check:
        name: HV1 ARM64 Check (nightly, aarch64-unknown-none)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install nightly toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: nightly-2026-08-17
                  components: rust-src

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-hv1-arm-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-hv1-arm-
                      ${{ runner.os }}-cargo-

            - name: Check hv1-arm (aarch64-unknown-none)
              run: >
                  cargo +nightly-2026-08-17 check -p hv1-arm
                  --target aarch64-unknown-none
                  -Zbuild-std=core,alloc
                  -Zbuild-std-features=compiler-builtins-mem

            # hv1-core is deliberately not checked for aarch64. Its own manifest
            # says so -- "hv1-core is the x86_64 Intel-VMX / AMD-SVM Type-1
            # hypervisor; ARM is the separate hv1-arm crate" -- and its core
            # types (vm, vcpu, boot) are built on VMX/SVM throughout. This step
            # asked the crate to compile for an architecture it does not target
            # and failed with ~75 unresolved x86_64/x86/raw_cpuid references.
            # ARM coverage is the hv1-arm check above, which passes.

    unikernel-build:
        name: Unikernel Guest Build (stable, i686)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Stable, and no -Zbuild-std: `x86_64-unknown-none` is a real
            # freestanding target that rustup ships a prebuilt `core` for, so
            # the guest needs neither nightly nor a cross-compiler on the
            # runner. It was `i686-unknown-linux-musl` -- a Linux target with
            # the Linux parts linked away -- until the guest outgrew a 4 GiB
            # address space.
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-unknown-none

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      crates/hv2-unikernel/target
                  key: ${{ runner.os }}-cargo-unikernel-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-unikernel-

            # From its own directory, not by --manifest-path. Cargo reads
            # .cargo/config.toml from the current directory upward rather than
            # from the manifest, and this crate's target and linker script both
            # live there -- run from the workspace root it would quietly build a
            # 64-bit host binary instead. The crate says so in a compile_error!
            # for anyone who tries.
            - name: Build the unikernel guest
              working-directory: crates/hv2-unikernel
              run: cargo build --release

            # The build succeeding is not the claim worth checking. A guest that
            # links but has no Multiboot header is not bootable, and the loader
            # would refuse it at provision time with no hint that the guest crate
            # was what changed. This asserts the two things
            # `BootSource::Multiboot` actually reads: the header magic at the
            # start of the image, and an entry point past it.
            - name: Check it is a bootable Multiboot image
              run: |
                  set -euo pipefail
                  elf=crates/hv2-unikernel/target/x86_64-unknown-none/release/hv2-unikernel

                  file_type=$(readelf -h "$elf" | awk -F: '/Type:/ {print $2}' | xargs)
                  case "$file_type" in
                      EXEC*) ;;
                      *) echo "expected an ET_EXEC executable, got: $file_type" >&2; exit 1 ;;
                  esac

                  # 0x1BADB002, little-endian, at the very start of .text.
                  magic=$(objdump -s -j .text --stop-address=0x100004 "$elf" \
                      | awk '/^ 100000/ {print $2}')
                  if [ "$magic" != "02b0ad1b" ]; then
                      echo "no Multiboot header at the start of .text (found: ${magic:-nothing})" >&2
                      exit 1
                  fi

                  entry=$(readelf -h "$elf" | awk -F: '/Entry point/ {print $2}' | xargs)
                  if [ "$entry" = "0x100000" ]; then
                      echo "entry point is the header itself; the loader would execute it" >&2
                      exit 1
                  fi
                  echo "bootable: Multiboot header at 0x100000, entry $entry"

    hv1-multiboot-build:
        name: HV1 Multiboot Image (stable, x86_64-unknown-none)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Stable and no -Zbuild-std: `x86_64-unknown-none` is a real
            # freestanding target with a prebuilt `core`. This is what makes an
            # executable image of hv1-core possible at all -- `hv1-boot` needs
            # the `bootloader` crate, which needs nightly, and is why the Type-1
            # hypervisor went so long without ever being run.
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-unknown-none
                  components: clippy

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      crates/hv1-multiboot/target
                  key: ${{ runner.os }}-cargo-hv1-multiboot-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-hv1-multiboot-

            # This crate had neither clippy nor rustfmt anywhere: `hv1-clippy`
            # covers hv1-core only, and the workspace jobs cannot see this one
            # because it is excluded from the workspace -- so `--all` does not
            # mean it. Most of the hypervisor's exit loop, its APIC and its
            # scheduler live here, which put the gap in the wrong place.
            - name: Check formatting
              working-directory: crates/hv1-multiboot
              run: cargo fmt -- --check

            - name: Run clippy on the image
              working-directory: crates/hv1-multiboot
              run: cargo clippy --release -- -D warnings

            # From its own directory: cargo reads .cargo/config.toml from the
            # current directory upward rather than from the manifest, and this
            # crate's target and linker script both live there.
            - name: Build the hv1 Multiboot image
              working-directory: crates/hv1-multiboot
              run: cargo build --release

            # Linking is not the claim. This image is an ELF64, which the
            # Multiboot specification's ELF path cannot load -- that path is
            # ELF32 -- so it must carry its own load addresses in the header,
            # and an entry point past the header rather than at it. A build that
            # silently lost either would present as a guest that boots and says
            # nothing, with nothing pointing at this crate.
            - name: Check it is a loadable Multiboot image
              run: |
                  set -euo pipefail
                  elf=crates/hv1-multiboot/target/x86_64-unknown-none/release/hv1-multiboot

                  class=$(readelf -h "$elf" | awk -F: '/Class:/ {print $2}' | xargs)
                  [ "$class" = "ELF64" ] || { echo "expected ELF64, got $class" >&2; exit 1; }

                  header=$(objdump -s -j .multiboot --stop-address=0x100020 "$elf" \
                      | awk '/^ 10000/ {printf "%s%s%s%s", $2, $3, $4, $5}')

                  # magic 0x1BADB002, then flags with bit 16 set: without that
                  # bit the address fields that follow are not read at all.
                  case "$header" in
                      02b0ad1b00000100*) ;;
                      *) echo "bad Multiboot magic or flags: ${header:0:16}" >&2; exit 1 ;;
                  esac

                  entry=$(readelf -h "$elf" | awk -F: '/Entry point/ {print $2}' | xargs)
                  if [ "$entry" = "0x100000" ]; then
                      echo "entry point is the header itself; the loader would execute it" >&2
                      exit 1
                  fi
                  echo "loadable: ELF64, address fields present, entry $entry"

    hv1-arm-test:
        name: HV1 ARM64 Test (host)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-hv1-arm-test-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-hv1-arm-test-
                      ${{ runner.os }}-cargo-

            - name: Run hv1-arm unit tests (host)
              run: cargo test -p hv1-arm

    hv1-test:
        name: HV1 Test (nightly, host)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install nightly toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: nightly-2026-08-17

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-hv1-test-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-hv1-test-
                      ${{ runner.os }}-cargo-

            - name: Run hv1-core tests
              run: cargo +nightly-2026-08-17 test -p hv1-core

    hv1-clippy:
        name: HV1 Clippy (nightly)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install nightly toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: nightly-2026-08-17
                  components: clippy, rust-src

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-hv1-clippy-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-hv1-clippy-
                      ${{ runner.os }}-cargo-

            - name: Run clippy on hv1-core
              run: >
                  cargo +nightly-2026-08-17 clippy -p hv1-core
                  --target x86_64-unknown-none
                  -Zbuild-std=core,alloc
                  -Zbuild-std-features=compiler-builtins-mem
                  -- -D warnings
