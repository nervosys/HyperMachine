name: CI

on:
    push:
        branches: [master, main]
    pull_request:
        branches: [master, main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: -D warnings

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Run cargo check
              run: cargo check --workspace --all-targets --exclude hv1-core --exclude hv1-boot

    test:
        name: Test
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Run tests
              run: cargo test --workspace --exclude hv2-core --exclude hv1-core --exclude hv1-boot

    test-core:
        name: Test Core (Linux only)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-core-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-core-
                      ${{ runner.os }}-cargo-

            - name: Run core tests
              run: cargo test -p hv2-core

            - name: Run doc tests
              run: cargo test --doc --workspace --exclude hv1-core --exclude hv1-boot

    test-core-windows:
        name: Test Core (Windows)
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-core-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-core-
                      ${{ runner.os }}-cargo-

            - name: Run core tests (Windows/WHPX)
              run: cargo test -p hv2-core

    test-core-macos:
        name: Test Core (macOS)
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-core-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-core-
                      ${{ runner.os }}-cargo-

            - name: Run core tests (macOS/HVF)
              run: cargo test -p hv2-core

    msrv:
        name: MSRV Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install MSRV toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: "1.87"

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-msrv-
                      ${{ runner.os }}-cargo-

            - name: Check MSRV compatibility
              run: cargo check --workspace --all-targets --exclude hv1-core --exclude hv1-boot

    fmt:
        name: Rustfmt
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt

            - name: Check formatting
              run: cargo fmt --all -- --check

    clippy:
        name: Clippy
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-clippy-
                      ${{ runner.os }}-cargo-

            - name: Run clippy
              run: cargo clippy --workspace --all-targets --exclude hv1-core --exclude hv1-boot -- -D warnings

    doc:
        name: Documentation
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Build documentation
              run: cargo doc --workspace --no-deps --exclude hv1-core --exclude hv1-boot
              env:
                  RUSTDOCFLAGS: -D warnings

    build-cli:
        name: Build CLI
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      artifact: hm
                      extra_artifact: hv2
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      artifact: hm.exe
                      extra_artifact: hv2.exe
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      artifact: hm
                      extra_artifact: hv2
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-build-
                      ${{ runner.os }}-cargo-

            - name: Build CLIs
              run: |
                  cargo build --release --package hm-cli
                  cargo build --release --package hv2-cli

            - name: Upload hm artifact
              uses: actions/upload-artifact@v4
              with:
                  name: hm-${{ matrix.target }}
                  path: target/release/${{ matrix.artifact }}
                  retention-days: 30

            - name: Upload hv2 artifact
              uses: actions/upload-artifact@v4
              with:
                  name: hv2-${{ matrix.target }}
                  path: target/release/${{ matrix.extra_artifact }}
                  retention-days: 30
