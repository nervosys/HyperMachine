name: CI

on:
    push:
        branches: [master, main]
    pull_request:
        branches: [master, main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: -D warnings

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Install protoc
              uses: arduino/setup-protoc@v3
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Run cargo check
              run: cargo check --workspace --all-targets --exclude hv1-core --exclude hv1-boot

    test:
        name: Test
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Install protoc
              uses: arduino/setup-protoc@v3
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Run tests
              run: cargo test --workspace --exclude hv2-core --exclude hv1-core --exclude hv1-boot

    test-core:
        name: Test Core (Linux only)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-core-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-core-
                      ${{ runner.os }}-cargo-

            - name: Install protoc
              uses: arduino/setup-protoc@v3
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Run core tests
              run: cargo test -p hv2-core

            - name: Run doc tests
              run: cargo test --doc --workspace --exclude hv1-core --exclude hv1-boot

    test-core-windows:
        name: Test Core (Windows)
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-core-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-core-
                      ${{ runner.os }}-cargo-

            - name: Run core tests (Windows/WHPX)
              run: cargo test -p hv2-core

    test-core-macos:
        name: Test Core (macOS)
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-core-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-core-
                      ${{ runner.os }}-cargo-

            - name: Run core tests (macOS/HVF)
              run: cargo test -p hv2-core

    msrv:
        name: MSRV Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install MSRV toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: "1.87"

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-msrv-
                      ${{ runner.os }}-cargo-

            - name: Install protoc
              uses: arduino/setup-protoc@v3
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Check MSRV compatibility
              run: cargo check --workspace --all-targets --exclude hv1-core --exclude hv1-boot

    fmt:
        name: Rustfmt
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt

            - name: Check formatting
              run: cargo fmt --all -- --check

    clippy:
        name: Clippy
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-clippy-
                      ${{ runner.os }}-cargo-

            - name: Install protoc
              uses: arduino/setup-protoc@v3
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Run clippy
              run: cargo clippy --workspace --all-targets --exclude hv1-core --exclude hv1-boot -- -D warnings

    doc:
        name: Documentation
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Install protoc
              uses: arduino/setup-protoc@v3
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Build documentation
              run: cargo doc --workspace --no-deps --exclude hv1-core --exclude hv1-boot
              env:
                  RUSTDOCFLAGS: -D warnings

    build-cli:
        name: Build CLI
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      artifact: hm
                      extra_artifact: hv2
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      artifact: hm.exe
                      extra_artifact: hv2.exe
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      artifact: hm
                      extra_artifact: hv2
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-build-
                      ${{ runner.os }}-cargo-

            - name: Install protoc
              uses: arduino/setup-protoc@v3
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Build CLIs
              run: |
                  cargo build --release --package hm-cli
                  cargo build --release --package hv2-cli

            - name: Upload hm artifact
              uses: actions/upload-artifact@v4
              with:
                  name: hm-${{ matrix.target }}
                  path: target/release/${{ matrix.artifact }}
                  retention-days: 30

            - name: Upload hv2 artifact
              uses: actions/upload-artifact@v4
              with:
                  name: hv2-${{ matrix.target }}
                  path: target/release/${{ matrix.extra_artifact }}
                  retention-days: 30

    # ── HV1 (Type 1 bare-metal hypervisor) — requires nightly ──

    # The HV1 jobs pin an exact nightly rather than tracking the latest.
    # Unpinned, they broke four times in one day for reasons unrelated to
    # any commit here: a new required method on core::iter::Step (x86_64),
    # a renamed rustc-abi value (bootloader), an unused_must_use lint under
    # -D warnings, and a yanked spin release. 2026-08-17 is the nightly that
    # produced the first all-green run (CI 32192729164).
    #
    # Bump this date deliberately and watch these jobs when you do; that is
    # the tradeoff for them no longer failing at random.
    hv1-check:
        name: HV1 Check (nightly, bare-metal)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install nightly toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: nightly-2026-08-17
                  components: rust-src

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-hv1-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-hv1-
                      ${{ runner.os }}-cargo-

            - name: Check hv1-core (x86_64-unknown-none)
              run: >
                  cargo +nightly check -p hv1-core
                  --target x86_64-unknown-none
                  -Zbuild-std=core,alloc
                  -Zbuild-std-features=compiler-builtins-mem

            # bootloader 0.11.17's build script shells out to `cargo install`
            # for its BIOS/UEFI stages, and that nested build fails to compile
            # lock_api 0.4.10 ("can't find crate for `std`"). Reproduced locally
            # on a different nightly, with and without -Zbuild-std, and for the
            # host target as well -- so it is not our configuration and not
            # nightly drift. Non-blocking until upstream ships a fix; the step
            # still runs and its result is still visible.
            - name: Check hv1-boot (x86_64-unknown-none)
              continue-on-error: true
              run: >
                  cargo +nightly check -p hv1-boot
                  --target x86_64-unknown-none
                  -Zbuild-std=core,alloc
                  -Zbuild-std-features=compiler-builtins-mem

    hv1-arm-check:
        name: HV1 ARM64 Check (nightly, aarch64-unknown-none)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install nightly toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: nightly-2026-08-17
                  components: rust-src

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-hv1-arm-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-hv1-arm-
                      ${{ runner.os }}-cargo-

            - name: Check hv1-arm (aarch64-unknown-none)
              run: >
                  cargo +nightly check -p hv1-arm
                  --target aarch64-unknown-none
                  -Zbuild-std=core,alloc
                  -Zbuild-std-features=compiler-builtins-mem

            # hv1-core is deliberately not checked for aarch64. Its own manifest
            # says so -- "hv1-core is the x86_64 Intel-VMX / AMD-SVM Type-1
            # hypervisor; ARM is the separate hv1-arm crate" -- and its core
            # types (vm, vcpu, boot) are built on VMX/SVM throughout. This step
            # asked the crate to compile for an architecture it does not target
            # and failed with ~75 unresolved x86_64/x86/raw_cpuid references.
            # ARM coverage is the hv1-arm check above, which passes.

    hv1-arm-test:
        name: HV1 ARM64 Test (host)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-hv1-arm-test-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-hv1-arm-test-
                      ${{ runner.os }}-cargo-

            - name: Run hv1-arm unit tests (host)
              run: cargo test -p hv1-arm

    hv1-test:
        name: HV1 Test (nightly, host)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install nightly toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: nightly-2026-08-17

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-hv1-test-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-hv1-test-
                      ${{ runner.os }}-cargo-

            - name: Run hv1-core tests
              run: cargo +nightly test -p hv1-core

    hv1-clippy:
        name: HV1 Clippy (nightly)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install nightly toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: nightly-2026-08-17
                  components: clippy, rust-src

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-hv1-clippy-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-hv1-clippy-
                      ${{ runner.os }}-cargo-

            - name: Run clippy on hv1-core
              run: >
                  cargo +nightly clippy -p hv1-core
                  --target x86_64-unknown-none
                  -Zbuild-std=core,alloc
                  -Zbuild-std-features=compiler-builtins-mem
                  -- -D warnings
