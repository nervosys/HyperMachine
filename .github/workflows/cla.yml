# CLA Bot — Contributor License Agreement check
#
# Requires contributors to sign the CLA before their pull requests can be
# merged. Uses the CLA Assistant Lite action backed by a signatures file
# stored in the default branch.

name: CLA

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  cla-check:
    # Both comment bodies have to reach the action, not just `recheck`.
    # While this listed `recheck` alone, the signing phrase was the one
    # comment body the job refused to run for, so signing was impossible:
    # the run appears in the Actions list as `issue_comment / skipped` and
    # signatures/cla.json stays empty. The action's own README guards on
    # both strings.
    if: |
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'issue_comment' &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        # The action publishes only vX.Y.Z tags; there is no v2, so this step
        # failed to resolve on every PR and the CLA check has been inert.
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/${{ github.repository }}/blob/master/CLA.md"
          # NOT master. This action stores signatures by committing
          # signatures/cla.json to this branch, and master requires a
          # pull request, so the commit is refused by the ruleset:
          #
          #   Error occurred when creating the signed contributors file:
          #   Repository rule violations found. Changes must be made
          #   through a pull request. Make sure the branch where
          #   signatures are stored is NOT protected.
          #
          # No amount of signing could have satisfied this check while it
          # pointed at a protected branch. `cla-signatures` exists for
          # this and is deliberately unprotected.
          branch: "cla-signatures"
          allowlist: "dependabot[bot],github-actions[bot],renovate[bot]"
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before we can merge this PR, you
            need to sign our [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/master/CLA.md).

            Please reply with the following comment to sign:

            > I have read the CLA Document and I hereby sign the CLA

          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
