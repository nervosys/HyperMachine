# Release Workflow
# Automated release process with changelogs and artifacts

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-artifacts:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: hm
            extra_artifact: hv2
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: hm
            extra_artifact: hv2
            archive: tar.gz
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: hm.exe
            extra_artifact: hv2.exe
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: hm
            extra_artifact: hv2
            archive: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-release-
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build (native)
        if: "!matrix.cross"
        run: |
          cargo build --release --target ${{ matrix.target }} --package hm-cli
          cargo build --release --target ${{ matrix.target }} --package hv2-cli

      - name: Build (cross)
        if: matrix.cross
        run: |
          cross build --release --target ${{ matrix.target }} --package hm-cli
          cross build --release --target ${{ matrix.target }} --package hv2-cli

      - name: Create archive (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../hypermachine-${{ matrix.target }}.tar.gz ${{ matrix.artifact }} ${{ matrix.extra_artifact }}

      - name: Create archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.artifact }},${{ matrix.extra_artifact }} -DestinationPath ../../../hypermachine-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hypermachine-${{ matrix.target }}
          path: hypermachine-${{ matrix.target }}.${{ matrix.archive }}

  create-release:
    name: Create Release
    needs: build-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          
          echo "## What's Changed in $CURRENT_TAG" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          
          if [ -n "$PREV_TAG" ]; then
            # Categorize commits by conventional commit prefix
            BREAKING=$(git log $PREV_TAG..$CURRENT_TAG --pretty=format:"- %s (%h)" --grep="^BREAKING\|^!" | head -20)
            FEATURES=$(git log $PREV_TAG..$CURRENT_TAG --pretty=format:"- %s (%h)" --grep="^feat" | head -30)
            FIXES=$(git log $PREV_TAG..$CURRENT_TAG --pretty=format:"- %s (%h)" --grep="^fix" | head -30)
            PERF=$(git log $PREV_TAG..$CURRENT_TAG --pretty=format:"- %s (%h)" --grep="^perf" | head -20)
            DOCS=$(git log $PREV_TAG..$CURRENT_TAG --pretty=format:"- %s (%h)" --grep="^docs" | head -20)
            CHORE=$(git log $PREV_TAG..$CURRENT_TAG --pretty=format:"- %s (%h)" --grep="^chore\|^ci\|^build\|^refactor" | head -20)
            
            if [ -n "$BREAKING" ]; then
              echo "### Breaking Changes" >> CHANGELOG.md
              echo "$BREAKING" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi
            if [ -n "$FEATURES" ]; then
              echo "### Features" >> CHANGELOG.md
              echo "$FEATURES" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi
            if [ -n "$FIXES" ]; then
              echo "### Bug Fixes" >> CHANGELOG.md
              echo "$FIXES" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi
            if [ -n "$PERF" ]; then
              echo "### Performance" >> CHANGELOG.md
              echo "$PERF" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi
            if [ -n "$DOCS" ]; then
              echo "### Documentation" >> CHANGELOG.md
              echo "$DOCS" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi
            if [ -n "$CHORE" ]; then
              echo "### Maintenance" >> CHANGELOG.md
              echo "$CHORE" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi
            
            # Uncategorized commits
            OTHER=$(git log $PREV_TAG..$CURRENT_TAG --pretty=format:"- %s (%h)" \
              --invert-grep --grep="^feat\|^fix\|^perf\|^docs\|^chore\|^ci\|^build\|^refactor\|^BREAKING\|^!" | head -20)
            if [ -n "$OTHER" ]; then
              echo "### Other Changes" >> CHANGELOG.md
              echo "$OTHER" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi
            
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...$CURRENT_TAG" >> CHANGELOG.md
          else
            echo "Initial release" >> CHANGELOG.md
          fi
          
          echo "" >> CHANGELOG.md
          echo "## Installation" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "Download the appropriate binary for your platform from the assets below." >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### Platforms" >> CHANGELOG.md
          echo "- **Linux (x86_64)**: \`hypermachine-x86_64-unknown-linux-gnu.tar.gz\`" >> CHANGELOG.md
          echo "- **Linux (ARM64)**: \`hypermachine-aarch64-unknown-linux-gnu.tar.gz\`" >> CHANGELOG.md
          echo "- **Windows (x86_64)**: \`hypermachine-x86_64-pc-windows-msvc.zip\`" >> CHANGELOG.md
          echo "- **macOS (ARM64)**: \`hypermachine-aarch64-apple-darwin.tar.gz\`" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "Each archive contains both \`hm\` (management CLI) and \`hv2\` (hypervisor CLI)." >> CHANGELOG.md

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -name '*.tar.gz' -exec mv {} release/ \;
          find artifacts -type f -name '*.zip' -exec mv {} release/ \;

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "" >> ../CHANGELOG.md
          echo "## Checksums (SHA-256)" >> ../CHANGELOG.md
          echo "" >> ../CHANGELOG.md
          echo '```' >> ../CHANGELOG.md
          cat SHA256SUMS.txt >> ../CHANGELOG.md
          echo '```' >> ../CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            release/*
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
