# Benchmark CI Workflow
# Runs performance benchmarks on push to main and generates reports

name: Benchmarks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      full_benchmark:
        description: 'Run full benchmark suite (slower)'
        required: false
        default: 'false'

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Test Criterion conversion failure accounting
        run: ./.github/scripts/test-criterion-conversion.ps1

      - name: Use a fresh measurement directory outside the build cache
        run: |
          $measurementRoot = Join-Path $env:RUNNER_TEMP ('hm-criterion-' + [guid]::NewGuid().ToString('N'))
          "CRITERION_HOME=$measurementRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # hv2-api's build script (tonic_prost_build) shells out to protoc, and
      # this job builds the workspace to reach hv2-core's benches. Without this
      # step the build fails before a single benchmark runs, and the
      # previously ignored benchmark failures were masking that.
      - name: Install protoc
        run: python tools/ci-install-protoc.py

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
            ${{ runner.os }}-cargo-

      - name: Run crypto benchmarks
        run: |
          cargo bench -p hv2-core --bench crypto_bench -- --noplot 2>&1 | Tee-Object -FilePath crypto_bench.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run API benchmarks
        run: |
          cargo bench -p hv2-api --bench api_bench -- --noplot 2>&1 | Tee-Object -FilePath api_bench.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # criterion (harness = false, used by every bench in this repo) never
      # emits the libtest `test <name> ... bench: <n> ns/iter` line that
      # tool: 'cargo' greps for -- not even with --output-format bencher,
      # which drops the leading `test <name>` token. What criterion does
      # always write is structured JSON under target/criterion/**/new/, so
      # convert that into the flat array the action's customSmallerIsBetter
      # tool consumes natively, independent of any harness's text output.
      - name: Convert criterion output to benchmark-action JSON
        run: |
          ./.github/scripts/criterion-to-benchmark-json.ps1 -CriterionDir $env:CRITERION_HOME -OutFile bench-data.json

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: HyperMachine Benchmarks
          tool: 'customSmallerIsBetter'
          output-file-path: bench-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # This job had never completed a run. The action stores history
          # by committing to a gh-pages branch, and this repository had none,
          # so it failed at `git switch gh-pages` before recording a single
          # measurement -- first on the fetch, and then, with the fetch
          # skipped, on the switch, because save-data-file still needs the
          # branch to write to.
          #
          # The branch now exists as an orphan carrying only dev/bench data.
          #
          # Note that this branch IS published. An earlier version of this
          # comment claimed GitHub Pages was not enabled here; it is, with
          # `source.branch` set to `gh-pages`, so everything the action
          # commits appears at nervosys.github.io/HyperMachine/dev/bench/.
          # The 404 that suggested otherwise comes from the Pages builds
          # failing, not from Pages being off. Whatever is stored here is
          # public.
          #
          # Do not protect the branch -- the action commits directly and a
          # pull-request rule breaks it, which is the same mistake the CLA
          # workflow made with `master`.
          #
          # Only pushes write history. Once the branch existed, every event
          # wrote to it, so 18 of the first 20 stored measurements came from
          # pull-request branches -- including branches since deleted. The
          # baseline this job compares against was therefore mostly other
          # people's unmerged work, which is a better explanation for the
          # comparison failures than runner noise alone. A pull request still
          # runs the benchmarks and still gets its comparison comment; it just
          # no longer records itself as history for the next run to measure
          # against.
          auto-push: ${{ github.event_name == 'push' }}
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@nervosys/hypermachine-team'

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: |
            crypto_bench.txt
            api_bench.txt
            bench-data.json
            ${{ env.CRITERION_HOME }}/**/estimates.json
            ${{ env.CRITERION_HOME }}/**/benchmark.json
            ${{ env.CRITERION_HOME }}/**/*.svg
          retention-days: 30

      - name: Comment PR with benchmark results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let cryptoBench = '';
            let apiBench = '';

            try {
              cryptoBench = fs.readFileSync('crypto_bench.txt', 'utf8');
            } catch (e) {
              cryptoBench = 'Crypto benchmarks not available';
            }

            try {
              apiBench = fs.readFileSync('api_bench.txt', 'utf8');
            } catch (e) {
              apiBench = 'API benchmarks not available';
            }

            const body = `## 📊 Benchmark Results

            ### Crypto Operations
            \`\`\`
            ${cryptoBench.substring(0, 4000)}
            \`\`\`

            ### API Operations
            \`\`\`
            ${apiBench.substring(0, 4000)}
            \`\`\`

            *Benchmarks run on ${new Date().toISOString()}*
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  benchmark-comparison:
    name: Compare with baseline
    runs-on: windows-latest
    needs: benchmark
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: pr

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install protoc
        working-directory: pr
        run: python tools/ci-install-protoc.py

      - name: Record comparison environment
        run: |
          $baselineCommit = git -C baseline rev-parse HEAD
          $candidateCommit = git -C pr rev-parse HEAD
          $cpu = Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors
          @{
            baseline_commit = $baselineCommit
            candidate_commit = $candidateCommit
            rust = (rustc --version)
            protoc = (protoc --version)
            runner_os = $env:RUNNER_OS
            cpu = $cpu
            captured_at_utc = (Get-Date).ToUniversalTime().ToString('o')
            limitations = 'Sequential crypto microbenchmarks on a shared runner; not sandbox readiness or a competitor comparison.'
          } | ConvertTo-Json -Depth 4 | Set-Content comparison-environment.json

      - name: Run baseline benchmarks
        working-directory: baseline
        run: |
          cargo bench -p hv2-core --bench crypto_bench -- --noplot --save-baseline baseline

      - name: Copy baseline results to PR directory
        run: |
          if (-not (Test-Path baseline/target/criterion)) {
            throw 'Baseline benchmark produced no Criterion directory'
          }
          New-Item -ItemType Directory -Force pr/target/criterion | Out-Null
          Copy-Item -Recurse -Force baseline/target/criterion/* pr/target/criterion

      - name: Run PR benchmarks and compare
        working-directory: pr
        run: |
          cargo bench -p hv2-core --bench crypto_bench -- --noplot --baseline baseline | Tee-Object -FilePath comparison.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Reported, not enforced, and the distinction matters here.
      #
      # This greps criterion's text for the word "regressed" and used to exit 1
      # on a match, with no threshold: a 1% wobble failed the build exactly as
      # a 200% regression would. Criterion prints that line for any benchmark
      # measured slower than its baseline, and the two runs being compared
      # happen on one shared CI runner, minutes apart, with a full rebuild in
      # between -- so noise produces it on most runs.
      #
      # The evidence it was noise: this failed identically on three Dependabot
      # PRs bumping a Terraform provider, a Docker base image and
      # tock-registers, none of which can affect hv2-core's crypto benchmarks.
      # It only became visible now because the job `needs: benchmark`, and that
      # job had never completed a run.
      #
      # Real regression alerting already exists, with a threshold and a
      # baseline built from stored history: github-action-benchmark in the job
      # above, at alert-threshold 150%. This step is here to put the numbers in
      # front of a reviewer, which it now does without failing the build for
      # having measured something on a busy machine.
      - name: Report regressions
        run: |
          if (Select-String -Path pr/comparison.txt -Pattern "regressed" -Quiet) {
            Write-Warning "Criterion reports slower measurements than baseline. Shared-runner contention and sequential builds limit attribution; inspect the raw results and repeat before attributing a regression:"
            Get-Content pr/comparison.txt | Select-String "regressed"
          } else {
            Write-Output "No benchmarks measured slower than baseline."
          }

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-comparison
          path: |
            comparison-environment.json
            pr/comparison.txt
            pr/target/criterion/**/estimates.json
          retention-days: 30
