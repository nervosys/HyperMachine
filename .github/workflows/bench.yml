# Benchmark CI Workflow
# Runs performance benchmarks on push to main and generates reports

name: Benchmarks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      full_benchmark:
        description: 'Run full benchmark suite (slower)'
        required: false
        default: 'false'

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # hv2-api's build script (tonic_prost_build) shells out to protoc, and
      # this job builds the workspace to reach hv2-core's benches. Without this
      # step the build fails before a single benchmark runs, and the
      # continue-on-error below was masking that.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
            ${{ runner.os }}-cargo-

      - name: Run crypto benchmarks
        run: |
          cargo bench -p hv2-core --bench crypto_bench -- --noplot 2>&1 | Tee-Object -FilePath crypto_bench.txt

      - name: Run API benchmarks
        run: |
          cargo bench -p hv2-api --bench api_bench -- --noplot 2>&1 | Tee-Object -FilePath api_bench.txt
        continue-on-error: true

      # criterion (harness = false, used by every bench in this repo) never
      # emits the libtest `test <name> ... bench: <n> ns/iter` line that
      # tool: 'cargo' greps for -- not even with --output-format bencher,
      # which drops the leading `test <name>` token. What criterion does
      # always write is structured JSON under target/criterion/**/new/, so
      # convert that into the flat array the action's customSmallerIsBetter
      # tool consumes natively, independent of any harness's text output.
      - name: Convert criterion output to benchmark-action JSON
        run: |
          ./.github/scripts/criterion-to-benchmark-json.ps1 -CriterionDir target/criterion -OutFile bench-data.json

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: HyperMachine Benchmarks
          tool: 'customSmallerIsBetter'
          output-file-path: bench-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # This job had never completed a run. The action stores history
          # by committing to a gh-pages branch, and this repository had none,
          # so it failed at `git switch gh-pages` before recording a single
          # measurement -- first on the fetch, and then, with the fetch
          # skipped, on the switch, because save-data-file still needs the
          # branch to write to.
          #
          # The branch now exists as an orphan carrying only dev/bench data.
          # GitHub Pages is not enabled for this repository, so nothing there
          # is published; it exists because this action stores data by
          # committing to a branch of that name. Do not protect it -- the
          # action commits directly and a pull-request rule breaks it, which
          # is the same mistake the CLA workflow made with `master`.
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@nervosys/hypermachine-team'

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            crypto_bench.txt
            api_bench.txt
            bench-data.json
            target/criterion/**/*.svg
          retention-days: 30

      - name: Comment PR with benchmark results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let cryptoBench = '';
            let apiBench = '';

            try {
              cryptoBench = fs.readFileSync('crypto_bench.txt', 'utf8');
            } catch (e) {
              cryptoBench = 'Crypto benchmarks not available';
            }

            try {
              apiBench = fs.readFileSync('api_bench.txt', 'utf8');
            } catch (e) {
              apiBench = 'API benchmarks not available';
            }

            const body = `## 📊 Benchmark Results

            ### Crypto Operations
            \`\`\`
            ${cryptoBench.substring(0, 4000)}
            \`\`\`

            ### API Operations
            \`\`\`
            ${apiBench.substring(0, 4000)}
            \`\`\`

            *Benchmarks run on ${new Date().toISOString()}*
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  benchmark-comparison:
    name: Compare with baseline
    runs-on: windows-latest
    needs: benchmark
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: baseline

      - uses: actions/checkout@v4
        with:
          path: pr

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run baseline benchmarks
        working-directory: baseline
        run: |
          cargo bench -p hv2-core --bench crypto_bench -- --noplot --save-baseline baseline
        continue-on-error: true

      - name: Copy baseline results to PR directory
        run: |
          if (Test-Path baseline/target/criterion) {
            Copy-Item -Recurse -Force baseline/target/criterion pr/target/criterion
          }
        continue-on-error: true

      - name: Run PR benchmarks and compare
        working-directory: pr
        run: |
          cargo bench -p hv2-core --bench crypto_bench -- --noplot --baseline baseline | Tee-Object -FilePath comparison.txt
        continue-on-error: true

      # Reported, not enforced, and the distinction matters here.
      #
      # This greps criterion's text for the word "regressed" and used to exit 1
      # on a match, with no threshold: a 1% wobble failed the build exactly as
      # a 200% regression would. Criterion prints that line for any benchmark
      # measured slower than its baseline, and the two runs being compared
      # happen on one shared CI runner, minutes apart, with a full rebuild in
      # between -- so noise produces it on most runs.
      #
      # The evidence it was noise: this failed identically on three Dependabot
      # PRs bumping a Terraform provider, a Docker base image and
      # tock-registers, none of which can affect hv2-core's crypto benchmarks.
      # It only became visible now because the job `needs: benchmark`, and that
      # job had never completed a run.
      #
      # Real regression alerting already exists, with a threshold and a
      # baseline built from stored history: github-action-benchmark in the job
      # above, at alert-threshold 150%. This step is here to put the numbers in
      # front of a reviewer, which it now does without failing the build for
      # having measured something on a busy machine.
      - name: Report regressions
        run: |
          if (Select-String -Path pr/comparison.txt -Pattern "regressed" -Quiet) {
            Write-Warning "Criterion reports slower measurements than baseline. On a shared runner this is usually noise -- compare against the alert-threshold job before treating it as real:"
            Get-Content pr/comparison.txt | Select-String "regressed"
          } else {
            Write-Output "No benchmarks measured slower than baseline."
          }

