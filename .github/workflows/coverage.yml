# Code Coverage Workflow
# Generates and uploads coverage reports

name: Coverage

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # Through env because a step's `if` cannot read `secrets`.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          components: llvm-tools-preview

      # hv2-api's build script runs prost-build, which needs protoc. Every
      # building job in ci.yml installs it; this workflow never did, so the
      # whole run has been failing before a single line of coverage was
      # measured.
      - name: Install protoc
        run: python tools/ci-install-protoc.py

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@6db3a280da9eee4283c045c7431ab5116f1a0089 # cargo-llvm-cov

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-
            ${{ runner.os }}-cargo-

      - name: Generate coverage report
        # One instrumented run, then two reports from it. Passing --codecov
        # and --html to a single invocation is rejected ("--html may not be
        # used together with --codecov"), which failed this job on every
        # push since June while uploading nothing.
        run: |
          cargo llvm-cov --workspace \
            --no-report
          cargo llvm-cov report --codecov --output-path codecov.json
          cargo llvm-cov report --html

      # Codecov refuses tokenless uploads here ("Token required"), and with
      # fail_ci_if_error: false that refusal was green on every run.
      - name: No Codecov token configured
        if: env.CODECOV_TOKEN == ''
        run: echo "::warning title=Coverage not uploaded::CODECOV_TOKEN is not set, so Codecov received nothing. The HTML report below is still uploaded."

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: codecov.json
          fail_ci_if_error: false
          verbose: true

      - name: Upload HTML report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: target/llvm-cov/html
          retention-days: 30
