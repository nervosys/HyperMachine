name: SDK packages

# Builds the Python and TypeScript SDKs as the packages a registry would hold
# and tests them as installed (tools/check-sdk-packages.sh), on every change
# to them. It publishes only for a tag named sdk-vX.Y.Z, and only after the
# `sdk-release` environment approves: see docs/RELEASING_SDKS.md for what that
# environment, PyPI and npm need set up first. Without them a tag fails at the
# publish step and nothing is published.

on:
  pull_request:
    paths:
      - "sdk/python/**"
      - "sdk/typescript/**"
      - "LICENSE"
      - "LICENSE-COMMERCIAL"
      - "tools/check-sdk-packages.sh"
      - ".github/workflows/sdk-packages.yml"
  push:
    branches: [master]
    paths:
      - "sdk/python/**"
      - "sdk/typescript/**"
      - "LICENSE"
      - "LICENSE-COMMERCIAL"
      - "tools/check-sdk-packages.sh"
      - ".github/workflows/sdk-packages.yml"
    tags: ["sdk-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and test the packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag names the packages' version
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: bash tools/check-sdk-packages.sh version "${REF_NAME#sdk-v}"

      - name: Python package, built and tested as installed
        run: bash tools/check-sdk-packages.sh python dist/python

      - name: TypeScript package, packed and tested as installed
        run: bash tools/check-sdk-packages.sh node dist/node

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-packages
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Approval by this environment's reviewers is what lets a tag publish.
    environment: sdk-release
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing: no token is stored
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/python

  publish-npm:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: sdk-release
    permissions:
      contents: read
      id-token: write # the provenance statement npm publishes with the package
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-packages
          path: dist
      - name: Publish the tested tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set for the sdk-release environment" >&2
            exit 1
          fi
          # npm reads the token from the environment, so it is never written down.
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/npmrc"
          npm publish dist/node/*.tgz --access public --provenance --userconfig "$RUNNER_TEMP/npmrc"
