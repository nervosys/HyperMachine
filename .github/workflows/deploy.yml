# Deployment CI/CD Workflow
# Handles container image builds, Kubernetes deployments, and infrastructure provisioning

name: Deploy

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests before deployment'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # Build Windows binaries and upload as artifacts
  build-binaries:
    name: Build Windows Binaries
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $version = $Matches[1]
          } else {
            $version = "0.0.0-dev.${{ github.run_number }}"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-deploy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deploy-
            ${{ runner.os }}-cargo-

      # hv2-api's build script shells out to protoc, and this job builds the
      # whole workspace. Without this it fails with "Could not find `protoc`"
      # before a single test runs -- which is how this job had been failing,
      # unnoticed, since the envd protos were added. ci.yml and bench.yml
      # already carry the same step.
      - name: Install protoc
        run: python tools/ci-install-protoc.py

      - name: Run tests
        if: inputs.skip_tests != 'true'
        run: cargo test --workspace --release

      - name: Build release
        run: cargo build --release

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hypermachine-${{ steps.version.outputs.version }}-windows
          path: |
            target/release/*.exe
            target/release/*.dll
          retention-days: 30

  # Build and push container image for K8s deployment
  build-container:
    name: Build Container Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-binaries, build-container]
    if: github.ref == 'refs/heads/main' || inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.hypermachine.nervosys.ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Configure Kubernetes context
        uses: azure/k8s-set-context@8698eba2499e9012f0d5085f8798077cce4bc526 # v5.0.1
        with:
          kubeconfig: ${{ secrets.STAGING_KUBECONFIG }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install hypermachine ./deploy/helm/hypermachine \
            --namespace hypermachine \
            --create-namespace \
            --set image.tag=sha-${GITHUB_SHA::7} \
            --set environment=staging \
            --values ./deploy/helm/hypermachine/values.yaml \
            --values ./deploy/helm/hypermachine/values-staging.yaml \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/hypermachine-hypermachine -n hypermachine --timeout=5m
          kubectl get pods -n hypermachine -l app.kubernetes.io/name=hypermachine

      - name: Run smoke tests
        run: |
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=hypermachine \
            -n hypermachine --timeout=2m

          kubectl port-forward svc/hypermachine-hypermachine 8080:80 -n hypermachine &
          PF_PID=$!
          sleep 3

          curl -f http://127.0.0.1:8080/health/live || exit 1
          echo "Smoke tests passed!"
          kill $PF_PID || true

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-binaries, build-container, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.environment == 'production'
    environment:
      name: production
      url: https://hypermachine.nervosys.ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Configure Kubernetes context
        uses: azure/k8s-set-context@8698eba2499e9012f0d5085f8798077cce4bc526 # v5.0.1
        with:
          kubeconfig: ${{ secrets.PRODUCTION_KUBECONFIG }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install hypermachine ./deploy/helm/hypermachine \
            --namespace hypermachine \
            --set image.tag=sha-${GITHUB_SHA::7} \
            --set environment=production \
            --set replicaCount=3 \
            --values ./deploy/helm/hypermachine/values.yaml \
            --values ./deploy/helm/hypermachine/values-production.yaml \
            --wait \
            --timeout 15m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/hypermachine-hypermachine -n hypermachine --timeout=10m

      - name: Run production tests
        run: |
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=hypermachine \
            -n hypermachine --timeout=5m

          kubectl port-forward svc/hypermachine-hypermachine 8080:80 -n hypermachine &
          PF_PID=$!
          sleep 3

          curl -f http://127.0.0.1:8080/health/live
          curl -f http://127.0.0.1:8080/health/ready
          curl -f http://127.0.0.1:8080/metrics

          echo "Production verification complete!"
          kill $PF_PID || true

  terraform:
    name: Infrastructure Provisioning
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.9.0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Terraform Init
        working-directory: deploy/terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: deploy/terraform
        run: terraform plan -out=tfplan
        env:
          TF_VAR_environment: ${{ inputs.environment }}

      - name: Terraform Apply
        working-directory: deploy/terraform
        run: terraform apply -auto-approve tfplan
        if: inputs.environment == 'staging'

      - name: Output infrastructure info
        working-directory: deploy/terraform
        run: terraform output -json > infrastructure.json

      - name: Upload infrastructure info
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infrastructure-${{ inputs.environment }}
          path: deploy/terraform/infrastructure.json

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [build-binaries, deploy-staging, deploy-production]
    if: always()
    # Through env because a step's `if` cannot read `secrets`.
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      # Without the secret this step used to run and fail behind
      # continue-on-error, so every deploy looked notified and none was.
      - name: No Slack webhook configured
        if: env.SLACK_WEBHOOK_URL == ''
        run: echo "::warning title=No deployment notification::SLACK_WEBHOOK_URL is not set, so no Slack message was sent."

      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          # From v2 the webhook is an input; the action does not read env.
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "HyperMachine Deployment ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*HyperMachine Deployment*\n*Status:* ${{ job.status }}\n*Version:* ${{ needs.build-binaries.outputs.version }}\n*Environment:* ${{ inputs.environment || 'staging' }}\n*Actor:* ${{ github.actor }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {"type": "plain_text", "text": "View Workflow"},
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        continue-on-error: true
