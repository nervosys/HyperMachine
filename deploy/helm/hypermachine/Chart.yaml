# HyperMachine Helm Chart
apiVersion: v2
name: hypermachine
description: A high-performance, agentic hypervisor framework
type: application
version: 0.3.0
appVersion: "0.3.0"
kubeVersion: ">=1.25.0"

keywords:
  - hypervisor
  - virtualization
  - ai
  - agentic
  - vm

home: https://github.com/nervosys/HyperMachine
sources:
  - https://github.com/nervosys/HyperMachine

icon: https://raw.githubusercontent.com/nervosys/HyperMachine/master/img/Hyperviseur.svg

maintainers:
  - name: nervosys
    email: support@nervosys.ai
    url: https://github.com/nervosys

dependencies:
  - name: redis
    version: "~18.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: postgresql
    version: "~13.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled

annotations:
  artifacthub.io/license: AGPL-3.0-only OR LicenseRef-Commercial
  artifacthub.io/category: virtualization
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "true"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: added
      description: Initial Helm chart release
