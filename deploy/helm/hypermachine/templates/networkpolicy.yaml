{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}
  labels:
    {{- include "hypermachine.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hypermachine.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- range .Values.networkPolicy.ingress }}
    - from:
        {{- toYaml .from | nindent 8 }}
      {{- if .ports }}
      ports:
        {{- toYaml .ports | nindent 8 }}
      {{- else }}
      ports:
        - protocol: TCP
          port: {{ $.Values.service.http.targetPort }}
        - protocol: TCP
          port: {{ $.Values.service.grpc.targetPort }}
        {{- if $.Values.metrics.enabled }}
        - protocol: TCP
          port: {{ $.Values.service.metrics.targetPort }}
        {{- end }}
      {{- end }}
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.egress }}
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
    {{- else }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
{{- end }}
