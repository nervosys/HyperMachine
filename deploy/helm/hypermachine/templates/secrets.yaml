{{- if or .Values.secrets.apiKey .Values.secrets.tlsCert .Values.secrets.dbPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}
  labels:
    {{- include "hypermachine.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.apiKey }}
  api-key: {{ .Values.secrets.apiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.tlsCert }}
  tls-cert: {{ .Values.secrets.tlsCert | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.tlsKey }}
  tls-key: {{ .Values.secrets.tlsKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.dbPassword }}
  db-password: {{ .Values.secrets.dbPassword | b64enc | quote }}
  {{- end }}
{{- end }}
