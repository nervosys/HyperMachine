# Production environment values
# High availability and security hardened

replicaCount: 3

resources:
  limits:
    cpu: "4"
    memory: 8Gi
  requests:
    cpu: "2"
    memory: 4Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

env:
  ENVIRONMENT: production
  LOG_LEVEL: info
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "true"
  FIPS_MODE: "true"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_RPS: "1000"

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1s"
  hosts:
    - host: hypermachine.nervosys.ai
      paths:
        - path: /
          pathType: Prefix
    - host: api.hypermachine.nervosys.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: hypermachine-prod-tls
      hosts:
        - hypermachine.nervosys.ai
        - api.hypermachine.nervosys.ai

persistence:
  enabled: true
  size: 100Gi
  storageClass: gp3
  accessModes:
    - ReadWriteOnce

metrics:
  serviceMonitor:
    enabled: true
    interval: 15s
  alerts:
    enabled: true
    cpuThreshold: 60
    memoryThreshold: 70
    responseTimeMs: 200
    errorRatePercent: 1

# Production security hardening
securityContext:
  runAsNonRoot: true
  runAsUser: 65534  # nobody user
  runAsGroup: 65534
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

podSecurityContext:
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Topology spread for HA
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: hypermachine
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: hypermachine

# Affinity rules
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: hypermachine
        topologyKey: kubernetes.io/hostname

# Health probes (more strict for production)
livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

# No debug endpoints in production
extraArgs: []

# Network policies
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
        - port: 6443  # Kubernetes API
