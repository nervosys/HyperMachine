# HyperMachine sandbox cluster. See docs/CUBESANDBOX_PARITY_ROADMAP.md, Phases 4-5.

image:
  # Built from Containerfile.sandbox: `--target control-plane` and `--target node`.
  controlPlane: ghcr.io/nervosys/hv2-control-plane:1.1.0
  node: ghcr.io/nervosys/hv2-sandboxd:1.1.0
  pullPolicy: IfNotPresent

# The API key clients send as X-API-Key (E2B_API_KEY) and the token control
# planes use with nodes. Left empty, each is generated once and kept across
# upgrades. `existingSecret` names a Secret with keys `api-key` and
# `cluster-token` instead.
auth:
  apiKey: ""
  clusterToken: ""
  existingSecret: ""

controlPlane:
  replicas: 2
  # How often each instance reaps sandboxes whose node stopped heartbeating.
  reapIntervalSeconds: 5
  service:
    type: ClusterIP
    apiPort: 80
    proxyPort: 49983
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { memory: 256Mi }

node:
  # Sandbox nodes must expose /dev/kvm: bare metal, or a VM with nested
  # virtualisation. Label them, and taint them so nothing else lands there:
  #   kubectl label node N hypermachine.io/sandbox-node=true
  #   kubectl taint node N hypermachine.io/sandbox-node=true:NoSchedule
  nodeSelector:
    hypermachine.io/sandbox-node: "true"
  tolerations:
    - key: hypermachine.io/sandbox-node
      operator: Equal
      value: "true"
      effect: NoSchedule
  # Sandboxes per node, and what each gets. A template-restored sandbox costs
  # the host ~2.5 MiB until its guest writes memory; plan for the guest's
  # working set, not its nominal size.
  capacity: 32
  memoryGb: 1
  cpuCores: 1
  # Give sandboxes a network behind the egress gateway (E2B's `network`
  # fields). Off, a sandbox has no NIC at all.
  network: true
  # What a sandbox that configures no egress policy gets: deny or allow.
  egressDefault: deny
  # Restore sandboxes from a template snapshot (default) rather than boot.
  template: true
  # Oversubscription: when a node is full, pause the sandbox idle longest
  # (at least this many seconds, with no request in flight) among those
  # created with autoResume, and park requests for a slot instead of
  # refusing them. Unset, a full node answers 503 and the control plane
  # tries another. Paused sandboxes live on the pod's disk, so they do not
  # survive the pod.
  evictIdleAfterSeconds: null
  # Prefault each restore's measured working set. Halves a restore's page
  # faults; measure on your hardware before turning it on (it made no
  # latency difference under nested virtualisation).
  prefault: false
  # A ReadWriteMany volume every node mounts -- templates, the egress CA and
  # paused sandboxes live there, so a sandbox paused on one node resumes on
  # any, survives its node, and a node draining (SIGTERM) pauses what it
  # runs into it instead of ending it. Name an existing PVC (NFS, EFS,
  # Filestore, CephFS...) to turn it on; the filesystem must make rename
  # atomic, which is how nodes claim a paused sandbox. Empty: paused
  # sandboxes stay on their node's disk and end with it.
  snapshotStore:
    claimName: ""
  resources:
    requests: { cpu: 500m, memory: 512Mi }

store:
  # Deploy a single Valkey instance with the chart. For production, point
  # `url` at a replicated Redis/Valkey instead and set `deploy: false`.
  deploy: true
  url: ""
  namespace: default
  image: valkey/valkey:8.1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 512Mi }

# Restrict each node daemon's API to the control planes. The cluster token is
# required either way; this is the second lock.
networkPolicy:
  enabled: true
