apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hv2.name" . }}-control-plane
  labels: {{- include "hv2.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels: {{- include "hv2.labels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5980"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: control-plane
          image: {{ .Values.image.controlPlane }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --store
            - {{ include "hv2.storeUrl" . | quote }}
            - --namespace
            - {{ .Values.store.namespace | quote }}
            - --port
            - "5980"
            - --proxy-port
            - "5981"
            - --reap-interval
            - {{ .Values.controlPlane.reapIntervalSeconds | quote }}
            {{- with .Values.identity.issuer }}
            - --identity-issuer
            - {{ . | quote }}
            {{- end }}
            {{- if .Values.mtls.controlPlaneSecret }}
            - --mtls-ca
            - /etc/hv2-mtls/ca.crt
            - --mtls-cert
            - /etc/hv2-mtls/tls.crt
            - --mtls-key
            - /etc/hv2-mtls/tls.key
            {{- end }}
          env:
            - name: HV2_API_KEY
              valueFrom: { secretKeyRef: { name: {{ include "hv2.secretName" . }}, key: api-key } }
            - name: HV2_CLUSTER_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "hv2.secretName" . }}, key: cluster-token } }
            - name: HV2_STORE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "hv2.secretName" . }}, key: store-password } }
            {{- if .Values.store.tlsSecret }}
            # For a rediss:// store: its CA, and this pod's client certificate.
            - { name: HV2_STORE_CA, value: /etc/hv2-store-tls/ca.crt }
            - { name: HV2_STORE_CERT, value: /etc/hv2-store-tls/tls.crt }
            - { name: HV2_STORE_KEY, value: /etc/hv2-store-tls/tls.key }
            {{- end }}
          ports:
            - { name: api, containerPort: 5980 }
            - { name: envd, containerPort: 5981 }
          readinessProbe:
            httpGet: { path: /health, port: api }
          livenessProbe:
            httpGet: { path: /health, port: api }
            periodSeconds: 20
          resources: {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          {{- if or .Values.mtls.controlPlaneSecret .Values.store.tlsSecret }}
          volumeMounts:
            {{- if .Values.mtls.controlPlaneSecret }}
            - { name: mtls, mountPath: /etc/hv2-mtls, readOnly: true }
            {{- end }}
            {{- if .Values.store.tlsSecret }}
            - { name: store-tls, mountPath: /etc/hv2-store-tls, readOnly: true }
            {{- end }}
      volumes:
        {{- if .Values.mtls.controlPlaneSecret }}
        - name: mtls
          secret: { secretName: {{ .Values.mtls.controlPlaneSecret | quote }} }
        {{- end }}
        {{- if .Values.store.tlsSecret }}
        - name: store-tls
          secret: { secretName: {{ .Values.store.tlsSecret | quote }} }
        {{- end }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hv2.name" . }}
  labels: {{- include "hv2.labels" . | nindent 4 }}
spec:
  type: {{ .Values.controlPlane.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: control-plane
  ports:
    # E2B_API_URL points here.
    - { name: api, port: {{ .Values.controlPlane.service.apiPort }}, targetPort: api }
    # E2B_SANDBOX_URL (or *.E2B_DOMAIN behind an ingress) points here.
    - { name: envd, port: {{ .Values.controlPlane.service.proxyPort }}, targetPort: envd }
