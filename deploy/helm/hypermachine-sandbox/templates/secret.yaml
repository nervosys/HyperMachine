{{- if not .Values.auth.existingSecret }}
{{- /* Generated once, then reused: a key that changed on every upgrade would
       lock out every client and orphan every node. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "hv2.secretName" .) }}
{{- $apiKey := .Values.auth.apiKey }}
{{- $token := .Values.auth.clusterToken }}
{{- if and (not $apiKey) $existing }}{{ $apiKey = index $existing.data "api-key" | b64dec }}{{ end }}
{{- if and (not $token) $existing }}{{ $token = index $existing.data "cluster-token" | b64dec }}{{ end }}
{{- $storePassword := .Values.auth.storePassword }}
{{- if and (not $storePassword) $existing }}{{ $storePassword = index $existing.data "store-password" | default "" | b64dec }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hv2.secretName" . }}
  labels: {{- include "hv2.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ $apiKey | default (printf "e2b_%s" (randAlphaNum 40 | lower)) | quote }}
  cluster-token: {{ $token | default (randAlphaNum 48) | quote }}
  store-password: {{ $storePassword | default (randAlphaNum 48) | quote }}
{{- end }}
