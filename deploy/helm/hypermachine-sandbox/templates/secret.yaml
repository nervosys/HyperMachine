{{- if not .Values.auth.existingSecret }}
{{- /* Generated once, then reused: a key that changed on every upgrade would
       lock out every client and orphan every node. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "hv2.secretName" .) }}
{{- $apiKey := .Values.auth.apiKey }}
{{- $token := .Values.auth.clusterToken }}
{{- if and (not $apiKey) $existing }}{{ $apiKey = index $existing.data "api-key" | b64dec }}{{ end }}
{{- if and (not $token) $existing }}{{ $token = index $existing.data "cluster-token" | b64dec }}{{ end }}
{{- if .Values.auth.storePassword }}{{ fail "auth.storePassword is replaced by auth.storePasswords.{controlPlane,node,gateway}: the store has one Redis user per role (finding O12)" }}{{ end }}
{{- /* One password per role. A Secret from before the roles has only
       `store-password`, which is not reused: each role gets a fresh one. */ -}}
{{- $passwords := dict }}
{{- range $role, $key := dict "controlPlane" "store-password-control-plane" "node" "store-password-node" "gateway" "store-password-gateway" }}
{{- $value := index $.Values.auth.storePasswords $role }}
{{- if and (not $value) $existing }}{{ $value = index $existing.data $key | default "" | b64dec }}{{ end }}
{{- if and $value (not (regexMatch "^[A-Za-z0-9]{24,}$" $value)) }}{{ fail (printf "auth.storePasswords.%s must be 24 or more letters and digits: it is spliced into a redis:// URL" $role) }}{{ end }}
{{- $_ := set $passwords $role $value }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hv2.secretName" . }}
  labels: {{- include "hv2.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ $apiKey | default (printf "e2b_%s" (randAlphaNum 40 | lower)) | quote }}
  cluster-token: {{ $token | default (randAlphaNum 48) | quote }}
  store-password-control-plane: {{ $passwords.controlPlane | default (randAlphaNum 48) | quote }}
  store-password-node: {{ $passwords.node | default (randAlphaNum 48) | quote }}
  store-password-gateway: {{ $passwords.gateway | default (randAlphaNum 48) | quote }}
{{- end }}
