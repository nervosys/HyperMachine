# One hv2-sandboxd per KVM-capable node. It advertises its pod IP, which is
# how control planes reach its API and envd proxy.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "hv2.name" . }}-node
  labels: {{- include "hv2.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: node
  template:
    metadata:
      labels: {{- include "hv2.labels" . | nindent 8 }}
        app.kubernetes.io/component: node
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3980"
        prometheus.io/path: /metrics
    spec:
      nodeSelector: {{- toYaml .Values.node.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml .Values.node.tolerations | nindent 8 }}
      # SIGTERM ends every sandbox and leaves the cluster at once; give it
      # time to stop its VMs rather than being killed mid-teardown.
      terminationGracePeriodSeconds: 60
      containers:
        - name: sandboxd
          image: {{ .Values.image.node }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --port
            - "3980"
            - --proxy-port
            - "3981"
            - --capacity
            - {{ .Values.node.capacity | quote }}
            - --memory-gb
            - {{ .Values.node.memoryGb | quote }}
            - --cpu-cores
            - {{ .Values.node.cpuCores | quote }}
            {{- if .Values.node.network }}
            - --network
            - --egress-default
            - {{ .Values.node.egressDefault | quote }}
            {{- range .Values.node.tenantReservedCidrs }}
            - --tenant-reserved-cidr
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if not .Values.node.template }}
            - --no-template
            {{- end }}
            {{- with .Values.node.evictIdleAfterSeconds }}
            - --evict-idle-after
            - {{ . | quote }}
            {{- end }}
            {{- if .Values.node.prefault }}
            - --prefault
            {{- end }}
            {{- if .Values.mtls.nodeSecret }}
            - --mtls-ca
            - /etc/hv2-mtls/ca.crt
            - --mtls-cert
            - /etc/hv2-mtls/tls.crt
            - --mtls-key
            - /etc/hv2-mtls/tls.key
            {{- end }}
            {{- with .Values.identity.issuer }}
            - --identity-issuer
            - {{ . | quote }}
            {{- end }}
            - --trust-domain
            - {{ .Values.identity.trustDomain | quote }}
            {{- range .Values.node.templates }}
            - --template
            - {{ printf "%s=%s" .name .initramfs | quote }}
            {{- end }}
            {{- if .Values.node.snapshotStore.claimName }}
            - --snapshot-store
            - /var/lib/hv2-store
            {{- end }}
            - --cluster-store
            - {{ include "hv2.storeUrl" . | quote }}
            - --cluster-namespace
            - {{ .Values.store.namespace | quote }}
            - --node-id
            - $(NODE_NAME)
            - --advertise-api
            - {{ if .Values.mtls.nodeSecret }}https{{ else }}http{{ end }}://$(POD_IP):3980
            - --advertise-proxy
            - $(POD_IP):3981
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: HV2_CLUSTER_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "hv2.secretName" . }}, key: cluster-token } }
            - name: HV2_STORE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "hv2.secretName" . }}, key: store-password } }
            {{- if .Values.store.tlsSecret }}
            # For a rediss:// store: its CA, and this pod's client certificate.
            - { name: HV2_STORE_CA, value: /etc/hv2-store-tls/ca.crt }
            - { name: HV2_STORE_CERT, value: /etc/hv2-store-tls/tls.crt }
            - { name: HV2_STORE_KEY, value: /etc/hv2-store-tls/tls.key }
            {{- end }}
          ports:
            - { name: api, containerPort: 3980 }
            - { name: envd, containerPort: 3981 }
          readinessProbe:
            # /metrics needs no token, and answers only once the template is
            # built and the node has joined -- both happen before it listens.
            # With mTLS the kubelet has no client certificate to probe with,
            # so the port opening -- which also waits for both -- is the sign.
            {{- if .Values.mtls.nodeSecret }}
            tcpSocket: { port: api }
            {{- else }}
            httpGet: { path: /metrics, port: api }
            {{- end }}
          resources: {{- toYaml .Values.node.resources | nindent 12 }}
          securityContext:
            # For /dev/kvm. A device plugin exposing it (e.g. KubeVirt's
            # devices.kubevirt.io/kvm) is the narrower grant where available;
            # swap this for that resource and drop privileged.
            privileged: true
          volumeMounts:
            - { name: kvm, mountPath: /dev/kvm }
            {{- with .Values.node.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.store.tlsSecret }}
            - { name: store-tls, mountPath: /etc/hv2-store-tls, readOnly: true }
            {{- end }}
            {{- if .Values.mtls.nodeSecret }}
            - { name: mtls, mountPath: /etc/hv2-mtls, readOnly: true }
            {{- end }}
            {{- if .Values.node.snapshotStore.claimName }}
            # The same path on every node: a paused sandbox's snapshot names
            # its template by absolute path.
            - { name: snapshot-store, mountPath: /var/lib/hv2-store }
            {{- end }}
      volumes:
        - name: kvm
          hostPath: { path: /dev/kvm, type: CharDevice }
        {{- with .Values.node.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.store.tlsSecret }}
        - name: store-tls
          secret: { secretName: {{ .Values.store.tlsSecret | quote }} }
        {{- end }}
        {{- if .Values.mtls.nodeSecret }}
        - name: mtls
          secret: { secretName: {{ .Values.mtls.nodeSecret | quote }} }
        {{- end }}
        {{- if .Values.node.snapshotStore.claimName }}
        - name: snapshot-store
          persistentVolumeClaim: { claimName: {{ .Values.node.snapshotStore.claimName | quote }} }
        {{- end }}
