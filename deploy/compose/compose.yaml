# One host, the whole cluster: a store, a control plane, one node.
#
#   export HV2_STORE_CONTROL_PLANE_PASSWORD=$(openssl rand -hex 24)
#   export HV2_STORE_NODE_PASSWORD=$(openssl rand -hex 24)
#   export HV2_STORE_GATEWAY_PASSWORD=$(openssl rand -hex 24)
#   docker compose -f deploy/compose/compose.yaml up --build
#   export E2B_API_URL=http://127.0.0.1:5980 E2B_SANDBOX_URL=http://127.0.0.1:5981
#   export E2B_API_KEY=$HV2_API_KEY   # the value below, or your own
#
# The host needs /dev/kvm. Add nodes on other hosts by running the node image
# there against the same store (see deploy/helm for Kubernetes).

# HV2_CLUSTER_TOKEN is what lets the node listen beyond its own loopback: a node
# with a token binds 0.0.0.0, so the control plane can dial node:3980 and
# node:3981, and one without binds 127.0.0.1 and could not be reached. The
# token guards the node's API and its proxy port (3981), which refuses a connection
# that does not open with a line only the control plane makes. Publish only the
# control plane's ports (5980, 5981), as below.
x-secrets: &secrets
  HV2_API_KEY: ${HV2_API_KEY:-e2b_change_me_before_exposing_this}
  HV2_CLUSTER_TOKEN: ${HV2_CLUSTER_TOKEN:-change-me-cluster-token}

# The store holds every sandbox's envd access token and the managed API keys.
# It has one Redis ACL user per role (security finding O12), so a node cannot
# read or delete the keys or their revocation records: hv2-control-plane,
# hv2-node and hv2-gateway (for a native gateway you run beside this; default
# user off). Each password is 24 or more letters and digits (hex is fine), and
# is spliced into a redis:// URL below. The `store-acl` job writes the ACL file
# from tools/redis-acl.py, which holds the table of who may touch which keys;
# the file has password hashes only. The namespace is the default one of
# --namespace and --cluster-namespace; if you set either, set it here too.
x-control-plane-store-url: &control-plane-store-url redis://hv2-control-plane:${HV2_STORE_CONTROL_PLANE_PASSWORD:?set HV2_STORE_CONTROL_PLANE_PASSWORD to 24+ letters and digits, e.g. openssl rand -hex 24}@store:6379
x-node-store-url: &node-store-url redis://hv2-node:${HV2_STORE_NODE_PASSWORD:?set HV2_STORE_NODE_PASSWORD to 24+ letters and digits, e.g. openssl rand -hex 24}@store:6379

services:
  store-acl:
    image: python:3.12-slim
    command: ["sh", "-c", "python /redis-acl.py --namespace default > /acl/users.acl && chmod 644 /acl/users.acl"]
    environment:
      HV2_ACL_CONTROL_PLANE_PASSWORD: ${HV2_STORE_CONTROL_PLANE_PASSWORD:?set HV2_STORE_CONTROL_PLANE_PASSWORD to 24+ letters and digits, e.g. openssl rand -hex 24}
      HV2_ACL_NODE_PASSWORD: ${HV2_STORE_NODE_PASSWORD:?set HV2_STORE_NODE_PASSWORD to 24+ letters and digits, e.g. openssl rand -hex 24}
      HV2_ACL_GATEWAY_PASSWORD: ${HV2_STORE_GATEWAY_PASSWORD:?set HV2_STORE_GATEWAY_PASSWORD to 24+ letters and digits, e.g. openssl rand -hex 24}
    volumes:
      - ../../tools/redis-acl.py:/redis-acl.py:ro
      - store-acl:/acl
    restart: "no"

  store:
    image: valkey/valkey:8.1
    command: ["--save", "", "--appendonly", "no", "--aclfile", "/acl/users.acl"]
    volumes:
      - store-acl:/acl:ro
    depends_on:
      store-acl: { condition: service_completed_successfully }
    restart: unless-stopped

  control-plane:
    build: { context: ../.., dockerfile: Containerfile.sandbox, target: control-plane }
    image: hv2-control-plane:dev
    command: ["--store", *control-plane-store-url, "--port", "5980", "--proxy-port", "5981"]
    environment: *secrets
    ports: ["5980:5980", "5981:5981"]
    depends_on: [store]
    restart: unless-stopped

  node:
    build: { context: ../.., dockerfile: Containerfile.sandbox, target: node }
    image: hv2-sandboxd:dev
    command:
      - --network
      - --capacity
      - "16"
      - --cluster-store
      - *node-store-url
      - --node-id
      - node-1
      - --advertise-api
      - http://node:3980
      - --advertise-proxy
      - node:3981
    environment: *secrets
    devices: ["/dev/kvm:/dev/kvm"]
    depends_on: [store]
    restart: unless-stopped
    stop_grace_period: 60s

volumes:
  store-acl:
