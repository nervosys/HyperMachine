# HyperMachine Kubernetes Deployment
#
# Deploy with: kubectl apply -f k8s/
# Or with Helm: helm install hypermachine ./helm/hypermachine
---
apiVersion: v1
kind: Namespace
metadata:
  name: hypermachine
  labels:
    app.kubernetes.io/name: hypermachine
    app.kubernetes.io/component: namespace
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hypermachine-config
  namespace: hypermachine
data:
  # API Configuration
  API_HOST: "0.0.0.0"
  API_PORT: "8080"
  GRPC_PORT: "50051"
  
  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  
  # Telemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_SERVICE_NAME: "hypermachine"
  
  # Security
  FIPS_MODE: "enabled"
  TLS_ENABLED: "true"
  
  # Rate limiting
  RATE_LIMIT_REQUESTS: "1000"
  RATE_LIMIT_WINDOW_SECS: "60"
---
apiVersion: v1
kind: Secret
metadata:
  name: hypermachine-secrets
  namespace: hypermachine
type: Opaque
stringData:
  # IMPORTANT: Replace these placeholder values before deploying.
  # Use kubectl create secret or an external secrets operator in production.
  # Generate with: openssl rand -base64 32
  API_KEY: "REPLACE_ME"
  TLS_CERT: |
    # Add your TLS certificate here
  TLS_KEY: |
    # Add your TLS private key here
  # Generate with: openssl rand -base64 32
  DB_PASSWORD: "REPLACE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypermachine-api
  namespace: hypermachine
  labels:
    app.kubernetes.io/name: hypermachine
    app.kubernetes.io/component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: hypermachine
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hypermachine
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: hypermachine
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/nervosys/hypermachine:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hypermachine-config
            - secretRef:
                name: hypermachine-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: hypermachine-data
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: hypermachine
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: hypermachine-api
  namespace: hypermachine
  labels:
    app.kubernetes.io/name: hypermachine
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
  selector:
    app.kubernetes.io/name: hypermachine
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: hypermachine-api-headless
  namespace: hypermachine
  labels:
    app.kubernetes.io/name: hypermachine
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 50051
      targetPort: grpc
  selector:
    app.kubernetes.io/name: hypermachine
    app.kubernetes.io/component: api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hypermachine-api
  namespace: hypermachine
  labels:
    app.kubernetes.io/name: hypermachine
    app.kubernetes.io/component: api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.hypermachine.io
      secretName: hypermachine-tls
  rules:
    - host: api.hypermachine.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hypermachine-api
                port:
                  name: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hypermachine
  namespace: hypermachine
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hypermachine
  namespace: hypermachine
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hypermachine
  namespace: hypermachine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hypermachine
subjects:
  - kind: ServiceAccount
    name: hypermachine
    namespace: hypermachine
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hypermachine-data
  namespace: hypermachine
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: fast-ssd
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hypermachine-api
  namespace: hypermachine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hypermachine-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hypermachine-api
  namespace: hypermachine
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hypermachine
      app.kubernetes.io/component: api
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hypermachine-api
  namespace: hypermachine
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hypermachine
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hypermachine
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 50051
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow application traffic
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432  # PostgreSQL
        - protocol: TCP
          port: 6379  # Redis
